# temper deployment config template (non-secret).
#
# Installed to ~/.config/temper/config.toml by deploy/install.sh if absent.
# Secrets (forge tokens/passwords, LLM credentials) are NOT here — the launcher
# maps the provisioned ~/.config/temper/secrets/roles.env onto the environment
# the resolver layers over this file (FORGEJO_ACCESS_TOKEN, FORGEJO_USERNAME/
# PASSWORD, TEMPER_FORGEJO_TOKEN_<ROLE>).
schema_version = 1

[forge]
type = "forgejo"
url = "http://127.0.0.1:3000"
# The default/admin identity (its token arrives via FORGEJO_ACCESS_TOKEN); the
# CI-reader web-UI login arrives via FORGEJO_USERNAME/PASSWORD.
admin = "bot"
ci_user = "bot"

[engine]
# Address and port for the daemon HTTP API. Worker processes long-poll this.
bind = "127.0.0.1:8080"
daemon_id = "temper-daemon-1"
repos = ["ai/temper", "ai/smith"]
roles = ["engineer"]
# Poll-backstop cadence: the level-triggered liveness backstop (ADR 0009).
# Webhooks are the low-latency accelerator; keep this slow to stay idle-quiet.
poll_cadence_secs = 120
# Mechanical backstop cadence: each verified webhook runs an immediate hinted
# pass, so this is the idle safety net. Remove the key to disable it entirely.
mechanical_cadence_secs = 300
lease_ttl_secs = 300
# Absolute path to the webhook shared-secret file. Remove to disable the webhook
# route (poll-only). systemd does not expand %h/$HOME here — use a full path.
# webhook_secret_file = "/home/temper/.config/temper/secrets/webhook-secret"
# workflow = "/home/temper/.config/temper/workflow.json"
