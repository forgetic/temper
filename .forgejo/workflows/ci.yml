name: ci

on:
  # Plan-centric delivery opens implementation PRs into per-feature branches
  # before opening the aggregate landing PR into main. Validate both shapes;
  # restricting this trigger to main leaves feature-branch PRs permanently
  # waiting for CI and prevents mechanical landing.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs, test executables, the
# final binary). A persistent host workspace also lets successive CI runs reuse
# Cargo's path-sensitive fingerprints without paying kache's per-crate key cost.
# Two caching notes drive the step layout below:
#   1. Build and run the cacheable test executables BEFORE linting, so the
#      expensive shared lib compiles are warmed once and reused by clippy. Keep
#      lint immediately after the all-target quick lane, matching `.temper/pre-pr`,
#      before narrower Cargo commands can change the active fingerprint set.
#      Linked test binaries remain in the persistent target for the next run.
#   2. Every cargo invocation on the build/test/lint cache path uses the SAME
#      `--all-targets` scope so feature unification matches and the cached lib
#      artifacts key-match across steps (see the comment in .cargo/config.toml).
#      clippy/check still recompile their own zero-byte `.rmeta` leaves, which
#      kache cannot cache, but that leaf cost is small. The scenario manifest
#      check and deterministic benchmark harness below are checked-in CLI lanes
#      after the build step, so they do not change that cache choreography. The
#      validation-grade live scenario lane requires an explicit scenario path;
#      aggregate feature PRs use the separate focused-feature-validation
#      workflow. PR CI preserves two cross-cutting live capstones; the broader
#      ignored/manual lane remains available explicitly. The manifest check is
#      additionally skipped unless its inputs or
#      implementation changed. Benchmark live mode remains explicit and
#      credential-gated, never part of PR CI.
jobs:
  validate:
    runs-on: host
    concurrency:
      group: temper-ci-rust
      cancel-in-progress: false
    defaults:
      run:
        working-directory: /var/tmp/temper-ci-workspace
    # Its system /tmp is also a small tmpfs shared with other workspaces, so the
    # first post-checkout step moves scratch data to disk-backed /var/tmp.
    steps:
      - name: Checkout
        # Bypass the default action mirror so a data.forgejo.org outage cannot
        # prevent this job from reaching the repository checkout.
        uses: https://github.com/actions/checkout@v4
      - name: Refresh persistent CI workspace
        # Cargo fingerprints contain absolute source paths. Keep one stable path
        # on the host so Cargo can reuse its target directly; kache supplies
        # artifacts when that target is cold. The concurrency group prevents
        # simultaneous mutation of the shared workspace.
        working-directory: ${{ github.workspace }}
        run: |
          stable_workspace="/var/tmp/temper-ci-workspace"
          mkdir -p "$stable_workspace"
          rsync -rlp --checksum --delete --exclude target/ \
            "$GITHUB_WORKSPACE/" "$stable_workspace/"
      - name: Prepare scratch directory
        # This Forgejo Actions runner does not provide the `runner.temp`
        # context. Use a short path outside the checkout so temporary git probes
        # and Unix-domain sockets retain their expected semantics.
        run: |
          scratch_dir="$(mktemp -d /var/tmp/t.XXXXXX)"
          {
            echo "TMPDIR=$scratch_dir"
            echo "TEMPER_CI_SCRATCH_DIR=$scratch_dir"
          } >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency graph
        # Enforce the engine -> worker -> agent tier boundaries (allowlist in
        # depgraph-rules.toml). Compiles nothing (just `cargo metadata`), so it
        # does not disturb the kache build-ordering below and fails fast.
        # cargo-depgraph-check is pre-installed on the host runner.
        run: cargo depgraph-check check
      - name: Rust file size
        run: scripts/check-rust-file-size.sh
      - name: No ambient env reads
        # Hermeticity guard (issue #202): only ./src/bin/* and the two sanctioned
        # shims (temper-config env shim, temper-agent-session entry) plus test
        # support may read std::env::{var,var_os,vars,args}. Fails fast on a new
        # stray reader. Compiles nothing.
        run: scripts/check-no-ambient-env.sh
      - name: Build
        run: cargo dev-test-build
      - name: Test (quick)
        # Keep this adjacent to the all-target test build. Narrow Cargo lanes
        # change the active feature/target fingerprint set and would make
        # nextest relink the workspace test binaries before running them.
        run: cargo dev-test-quick
      - name: Lint
        # Keep this adjacent to the all-target build/test lanes so local pre-PR
        # Clippy artifacts key-match before narrower CI-only Cargo lanes run.
        run: cargo dev-clippy
      - name: Test (e2e capstones)
        # The live e2e lane boots real Forgejo + CI runners and waits for
        # convergence. On a cold CI machine the fixture provisioning alone can
        # take ~2min, so the budget needs headroom over the 300s default — but
        # not so much that a genuinely-stuck e2e burns ten minutes before
        # failing. The convergence timer starts after provisioning, so keep a
        # full five-minute convergence window while still failing stuck runs
        # promptly.
        env:
          TEMPER_TEST_CONVERGENCE_TIMEOUT_SECS: "300"
        run: |
          export BENCH_FORGEJO_CACHE_DIR="$HOME/.cache/bench-forgejo"
          cargo dev-test-e2e-capstones
      - name: Detect scenario manifest changes
        id: scenario-manifest-changes
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          for sha in "$base_sha" "$head_sha"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done
          changed="$({ git diff --name-only "$base_sha" "$head_sha"; } | awk '
            /^scenarios\// ||
            /^crates\/temper-scenario-core\// ||
            /^\.cargo\/config\.toml$/ ||
            /^Cargo\.(toml|lock)$/ ||
            /^\.forgejo\/workflows\/ci\.yml$/ { found = 1 }
            END { print found ? "true" : "false" }
          ')"
          echo "needed=$changed" >> "$GITHUB_OUTPUT"
      - name: Scenario manifest check
        # Validate checked-in manifests and local fixture references without
        # executing the implicit live scenario topology. Unrelated PRs skip the
        # narrow checker lane entirely.
        if: steps.scenario-manifest-changes.outputs.needed == 'true'
        run: cargo dev-scenario-check
      - name: Agent-session benchmark harness
        # Runs the real agent loop against deterministic Jig responses, then
        # verifies structural run/aggregate summaries and the harness disclaimer.
        # No provider credentials or timing thresholds belong in this lane.
        run: cargo dev-benchmark-harness
      - name: Cleanup scratch directory
        if: ${{ always() }}
        run: |
          if [ -n "${TEMPER_CI_SCRATCH_DIR:-}" ]; then
            rm -rf -- "$TEMPER_CI_SCRATCH_DIR"
          fi

  # The temper-web TypeScript UI (crates/temper-web/ui). Kept a separate job from
  # the Rust `validate` job above so a TS failure is legible on its own and does
  # not wait on (or block) the Rust build. Node 22 / npm 11 are already on the
  # host runner's PATH, so no setup-node step is needed.
  web:
    runs-on: host
    defaults:
      run:
        working-directory: crates/temper-web/ui
    steps:
      - name: Checkout
        # Bypass the default action mirror so a data.forgejo.org outage cannot
        # prevent this job from reaching the repository checkout.
        uses: https://github.com/actions/checkout@v4
      - name: Install (npm ci)
        # `npm ci` installs exactly the committed package-lock.json. Keep the
        # install hermetic and bounded: advisory/funding network calls are not
        # validation gates and can strand the shared runner after extraction.
        run: npm ci --no-audit --no-fund
      - name: Test (vitest)
        run: npm test
      - name: Build (esbuild)
        # Proves the two bundles (dist/board.js, dist/chat.js) compile.
        run: npm run build
