name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    runs-on: host
    defaults:
      run:
        working-directory: ${{ env.HOME }}/.local/state/forgejo/runner/data/temper
    steps:
      - name: Checkout
        run: |
          set -eu

          repo_dir="$HOME/.local/state/forgejo/runner/data/temper"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          mkdir -p "$(dirname "$repo_dir")"

          if [ -d "$repo_dir/.git" ]; then
            cd "$repo_dir"
            git remote set-url origin "$repo_url"
          else
            rm -rf "$repo_dir"
            git -c http.extraheader="AUTHORIZATION: token $GITHUB_TOKEN" \
              clone --no-checkout "$repo_url" "$repo_dir"
            cd "$repo_dir"
          fi

          git -c http.extraheader="AUTHORIZATION: token $GITHUB_TOKEN" \
            fetch --force --prune origin "$GITHUB_REF"
          git checkout --force --detach FETCH_HEAD
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx -e target/
      - name: Lint
        run: |
          set -eu
          cargo fmt --all
          cargo dev-clippy
      - name: Check
        run: |
          set -eu
          cargo dev-check
      - name: Test
        run: |
          set -eu
          cargo dev-test-full
