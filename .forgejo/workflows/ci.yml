name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs, test executables, the
# final binary). Two caching notes drive the step layout below:
#   1. Build the cacheable test executables BEFORE linting, so the expensive
#      shared lib compiles are warmed once and reused by clippy.
#   2. Every cargo invocation uses the SAME `--all-targets` scope so feature
#      unification matches and the cached lib artifacts key-match across steps
#      (see the comment in .cargo/config.toml). clippy/check still recompile
#      their own zero-byte `.rmeta` leaves, which kache cannot cache, but that
#      leaf cost is small.
jobs:
  validate:
    runs-on: host
    env:
      # Keep the pinned Forgejo fixture binary (bench-forgejo downloads it for
      # the ignored e2e tests) outside the workspace so the per-run clean
      # checkout does not throw it away.
      BENCH_FORGEJO_CACHE_DIR: ${{ env.HOME }}/.cache/bench-forgejo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency graph
        # Enforce the engine -> worker -> agent tier boundaries (allowlist in
        # depgraph-rules.toml). Compiles nothing (just `cargo metadata`), so it
        # does not disturb the kache build-ordering below and fails fast.
        # cargo-depgraph-check is pre-installed on the host runner.
        run: cargo depgraph-check check
      - name: Rust file size
        run: scripts/check-rust-file-size.sh
      - name: Lint
        run: cargo dev-clippy
      - name: Build
        run:  cargo dev-test-build
      - name: Test
        # The ignored daemon e2e scenarios boot a real Forgejo + CI runner and
        # wait for convergence (PR opened, CI red→green, mechanical merge). On a
        # cold CI machine the fixture provisioning alone can take ~2min, eating
        # the default 300s budget before the inner CI build + merge-on-green
        # cycle completes. Give it generous headroom here (local warm runs are
        # unaffected — they keep the 300s default).
        env:
          TEMPER_TEST_CONVERGENCE_TIMEOUT_SECS: "600"
        run: cargo dev-test-full
