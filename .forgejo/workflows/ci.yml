name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs, test executables, the
# final binary). Check-only passes (clippy/`cargo check`) emit zero-byte
# `.rmeta` leaves that kache cannot cache and so recompile every run — the step
# ordering below (build the cacheable test executables first, lint a minimal
# surface afterwards) is chosen to keep that uncacheable work small.
#
# temper depends on sibling repos by relative path — ../skein, ../tongs, ../jig
# (workspace deps) and ../../../bench, ../../../jig (crate deps), all of which
# resolve to siblings of the temper checkout. CI reproduces that layout by
# checking temper out into a `temper/` subdir of the job workspace and cloning
# skein, tongs, jig, and bench next to it. The siblings also depend on each
# other by the same flat-sibling paths (jig→skein, tongs→skein/jig), which
# resolves because every repo is a flat sibling here too.
jobs:
  validate:
    runs-on: host
    env:
      # Keep the pinned Forgejo fixture binary (bench-forgejo downloads it for
      # the ignored e2e tests) outside the workspace so the per-run clean
      # checkout does not throw it away.
      BENCH_FORGEJO_CACHE_DIR: ${{ env.HOME }}/.cache/bench-forgejo
    defaults:
      run:
        working-directory: temper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: temper
      # Sibling path dependencies. A second actions/checkout cannot fetch these:
      # the job token is scoped to ai/temper, so the action's repo lookup 404s
      # for ai/skein etc. The repos are public, so a plain anonymous clone of
      # each default branch does the job — the same pattern jig's CI uses, and
      # the fix for the earlier attempt that tried actions/checkout per sibling.
      - name: Checkout sibling path dependencies
        working-directory: .
        run: |
          set -eu
          for repo in skein tongs jig bench; do
            rm -rf "$repo"
            git clone --depth 1 "${{ github.server_url }}/ai/$repo.git" "$repo"
          done
      - name: Format
        run: |
          set -eu
          # Format temper's own workspace members only — NOT `cargo fmt --all`,
          # which would descend into the sibling path-dep checkouts next door
          # (skein / tongs / jig / bench) and try to police code temper's CI
          # does not own. Members are derived at runtime so the list never
          # drifts. (Matches the prior in-place formatting pass; the tree is not
          # yet rustfmt-clean workspace-wide, so enforcing --check is a separate
          # follow-up.)
          cargo fmt $(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(' '.join('-p '+p['name'] for p in json.load(sys.stdin)['packages']))")
      # Build the test executables first: they emit real artifacts that kache
      # caches in full, so on a clean checkout with a warm cache this is the
      # cheap step. Lint runs afterwards. There is deliberately no separate
      # `cargo check` step — clippy already type-checks, so a check pass would
      # only duplicate clippy's (uncacheable, metadata-only) work.
      - name: Build
        run: |
          set -eu
          cargo dev-test-build
      - name: Lint
        # `dev-clippy` lints lib+bin targets only. clippy runs rustc in
        # metadata-only mode and produces zero-byte `.rmeta` leaves that kache
        # cannot cache, so every linted target recompiles every run; keeping the
        # surface to lib+bins (not `--all-targets`) avoids ~135 uncacheable
        # test-target checks. Test code is compiled (and thus type-checked) by
        # the Build step above; run `cargo dev-clippy-all` locally for lint
        # coverage of test code.
        run: |
          set -eu
          cargo dev-clippy
      - name: Test
        # The ignored daemon e2e scenarios boot a real Forgejo + CI runner and
        # wait for convergence (PR opened, CI red→green, mechanical merge). On a
        # cold CI machine the fixture provisioning alone can take ~2min, eating
        # the default 300s budget before the inner CI build + merge-on-green
        # cycle completes. Give it generous headroom here (local warm runs are
        # unaffected — they keep the 300s default).
        env:
          TEMPER_TEST_CONVERGENCE_TIMEOUT_SECS: "900"
        run: |
          set -eu
          cargo dev-test-full
