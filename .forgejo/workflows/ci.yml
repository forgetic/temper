name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs, test executables, the
# final binary). Two caching notes drive the step layout below:
#   1. Build and run the cacheable test executables BEFORE linting, so the
#      expensive shared lib compiles are warmed once and reused by clippy.
#      Linked test binaries are then discarded before linting; otherwise the
#      full no-run test set plus clippy metadata can exceed the host runner's
#      local checkout budget even though kache has the reusable artifacts.
#   2. Every cargo invocation on the build/test/lint cache path uses the SAME
#      `--all-targets` scope so feature unification matches and the cached lib
#      artifacts key-match across steps (see the comment in .cargo/config.toml).
#      clippy/check still recompile their own zero-byte `.rmeta` leaves, which
#      kache cannot cache, but that leaf cost is small. The scenario manifest
#      check and deterministic scenario run below are tiny checked-in CLI runs
#      after the build step, so they do not change that cache choreography.
jobs:
  validate:
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency graph
        # Enforce the engine -> worker -> agent tier boundaries (allowlist in
        # depgraph-rules.toml). Compiles nothing (just `cargo metadata`), so it
        # does not disturb the kache build-ordering below and fails fast.
        # cargo-depgraph-check is pre-installed on the host runner.
        run: cargo depgraph-check check
      - name: Rust file size
        run: scripts/check-rust-file-size.sh
      - name: No ambient env reads
        # Hermeticity guard (issue #202): only ./src/bin/* and the two sanctioned
        # shims (temper-config env shim, temper-agent-session entry) plus test
        # support may read std::env::{var,var_os,vars,args}. Fails fast on a new
        # stray reader. Compiles nothing.
        run: scripts/check-no-ambient-env.sh
      - name: Build
        run: cargo dev-test-build
      - name: Scenario manifest check
        # Validate checked-in manifests and local fixture references without
        # running the live Forgejo/e2e scenario lane.
        run: cargo run -p temper-scenario-cli -- check scenarios
      - name: Deterministic scenario run
        # Exercise the hermetic in-process basic-delivery runner without live
        # Forgejo or external services.
        run: cargo run -p temper-scenario-cli -- run scenarios/basic-delivery
      - name: Test (quick)
        run: cargo dev-test-quick
      - name: Free linked test binaries
        # Keep kache-warmed libraries, but drop the linked executables that
        # clippy does not consume; this keeps the checkout target dir below the
        # host runner's disk ceiling.
        run: find target/debug target/debug/deps -maxdepth 1 -type f -perm -111 ! -name '*.so' -delete
      - name: Lint
        run: cargo dev-clippy

  # The temper-web TypeScript UI (crates/temper-web/ui). Kept a separate job from
  # the Rust `validate` job above so a TS failure is legible on its own and does
  # not wait on (or block) the Rust build. Node 22 / npm 11 are already on the
  # host runner's PATH, so no setup-node step is needed.
  web:
    runs-on: host
    defaults:
      run:
        working-directory: crates/temper-web/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install (npm ci)
        # `npm ci` installs exactly the committed package-lock.json — fails if it
        # is missing or out of sync with package.json.
        run: npm ci
      - name: Test (vitest)
        run: npm test
      - name: Build (esbuild)
        # Proves the two bundles (dist/board.js, dist/chat.js) compile.
        run: npm run build
