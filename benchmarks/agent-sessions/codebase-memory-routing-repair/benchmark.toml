schema = "temper.benchmark.v1"
name = "codebase-memory-routing-repair"
fixture = "fixture"
workspace_context = "workspace-context.json"
capture = "diagnostic"
validation_command_prefixes = [["cd", "repo", "&&", "cargo", "test", "--quiet"]]
discovery_command_prefixes = [["git", "grep"], ["rg"]]
post_run_commands = [["cargo", "test", "--quiet", "--manifest-path", "repo/Cargo.toml", "--target-dir", ".benchmark-target"]]
jig_script = "jig.json"
expected_patch = "expected.patch"
repetitions = 1

[[graph_decision_targets]]
target = "worker_slot"
kind = "implementation"
result_contains = "graph_implementation_evidence"

[[graph_decision_targets.consumption]]
tool = "search_code"
target = "worker_slot"

[[graph_decision_targets]]
target = "worker_slot"
kind = "implementation"
result_contains = "code_refinement_evidence"

[[graph_decision_targets.consumption]]
tool = "trace_path"
target = "worker_slot"

[[graph_decision_targets]]
target = "DeliveryAttempt"
kind = "caller"
result_contains = "trace_caller_evidence"

[[graph_decision_targets.consumption]]
tool = "get_code_snippet"
target = "DeliveryAttempt"

[[graph_decision_targets]]
target = "DeliveryRouter::worker_for"
kind = "caller"
result_contains = "delivery_source_evidence"

[[graph_decision_targets.consumption]]
tool = "get_code_snippet"
target = "DeliveryRouter::worker_for"

[[graph_decision_targets]]
target = "repo/tests/alias_retry.rs"
kind = "focused_test"
result_contains = "focused_test_evidence"

[[graph_decision_targets]]
target = "repo/src/route.rs"
kind = "implementation"
result_contains = "worker_source_evidence"

[condition_profile]
kind = "codebase_memory"
fixture_provider = "codebase-memory-mcp.py"
disabled_jig_script = "jig-disabled.json"
unavailable_jig_script = "jig-unavailable.json"

[annotations]
provider_region = "loopback"
cache_warmth = "not-applicable"
