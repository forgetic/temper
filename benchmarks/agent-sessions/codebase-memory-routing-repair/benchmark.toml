schema = "temper.benchmark.v1"
name = "codebase-memory-routing-repair"
fixture = "fixture"
workspace_context = "workspace-context.json"
capture = "diagnostic"
validation_command_prefixes = [["cd", "repo", "&&", "cargo", "test", "--quiet"]]
discovery_command_prefixes = [["git", "grep"], ["rg"]]
post_run_commands = [["cargo", "test", "--quiet", "--manifest-path", "repo/Cargo.toml", "--target-dir", ".benchmark-target"]]
jig_script = "jig.json"
expected_patch = "expected.patch"
repetitions = 1

[[graph_decision_targets]]
target = "worker_slot"
kind = "implementation"
[graph_decision_targets.producer]
tool = "search_graph"
target_kind = "graph_query"
target = "aliased delivery retry worker affinity"
[[graph_decision_targets.consumption]]
tool = "search_code"
target_kind = "pattern"
target = "worker_slot"

[[graph_decision_targets]]
target = "worker_slot"
kind = "implementation"
[graph_decision_targets.producer]
tool = "search_code"
target_kind = "pattern"
target = "worker_slot"
[[graph_decision_targets.consumption]]
tool = "trace_path"
target_kind = "function_name"
target = "worker_slot"

[[graph_decision_targets]]
target = "DeliveryAttempt"
kind = "caller"
[graph_decision_targets.producer]
tool = "trace_path"
target_kind = "function_name"
target = "worker_slot"
[[graph_decision_targets.consumption]]
tool = "get_code_snippet"
target_kind = "qualified_name"
target = "DeliveryAttempt"

[[graph_decision_targets]]
target = "DeliveryRouter::worker_for"
kind = "caller"
[graph_decision_targets.producer]
tool = "get_code_snippet"
target_kind = "qualified_name"
target = "DeliveryAttempt"
[[graph_decision_targets.consumption]]
tool = "get_code_snippet"
target_kind = "qualified_name"
target = "DeliveryRouter::worker_for"

[[graph_decision_targets]]
target = "repo/tests/alias_retry.rs"
kind = "focused_test"
[graph_decision_targets.producer]
tool = "search_graph"
target_kind = "graph_query"
target = "aliased delivery retry worker affinity"

[[graph_decision_targets]]
target = "repo/src/route.rs"
kind = "implementation"
[graph_decision_targets.producer]
tool = "get_code_snippet"
target_kind = "qualified_name"
target = "DeliveryRouter::worker_for"

[condition_profile]
kind = "codebase_memory"
fixture_provider = "codebase-memory-mcp.py"
disabled_jig_script = "jig-disabled.json"
unavailable_jig_script = "jig-unavailable.json"

[annotations]
provider_region = "loopback"
cache_warmth = "not-applicable"

[acceptance]
mode = "live"
smoke_repetitions = 1
matrix_repetitions = 5
provider = "openai-codex"
model = "gpt-5.6-sol"
minimum_relevance_percent = 50
minimum_improvement_percent = 20
improvement_measure = "conventional_discovery_calls"
exact_source_selection_target = "repo/src/route.rs"
required_decision_kinds = ["implementation", "caller", "focused_test"]
required_consumption_modes = ["source", "selection"]
privacy_forbidden_fragments = ["MCP-FIXTURE-SECRET", "Authorization: Bearer"]
