[package]
name = "temper-sim"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic simulation harness: production daemon code under skein's lab runtime."

[dependencies]
async-trait.workspace = true
chrono.workspace = true
skein.workspace = true
serde_json.workspace = true
temper-engine-io = { path = "../temper-engine-io" }
temper-engine = { path = "../temper-engine" }
# Reusable co-resident worker→daemon carrier for future real WorkerShell sim
# scenarios; this issue only exposes the dependency, it does not add a harness.
temper-daemon-transport = { path = "../temper-daemon-transport" }
temper-protocol-worker = { path = "../temper-protocol-worker" }

[dev-dependencies]
temper-forge = { path = "../temper-forge" }
temper-forge-memory = { path = "../temper-forge-memory" }
temper-workflow = { path = "../temper-workflow" }
# Logging tests (issue #212) install a capturing subscriber via with_default.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
