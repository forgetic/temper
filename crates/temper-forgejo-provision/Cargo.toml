[package]
name = "temper-forgejo-provision"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Forgejo provisioning and seeding for the reference-delivery demo."

[dependencies]
temper-forge = { path = "../temper-forge" }
temper-forge-forgejo = { path = "../temper-forge-forgejo" }
temper-provision = { path = "../temper-provision" }
temper-reference-delivery = { path = "../temper-reference-delivery" }
temper-runner = { path = "../temper-runner" }
temper-workflow = { path = "../temper-workflow" }
temper-engine-io = { path = "../temper-engine-io" }

[dev-dependencies]
skein.workspace = true
# Boots a throwaway Forgejo (admin bootstrap + lifecycle) so the ignored
# behavior tests can drive the production `provision_world` against a real
# backend. Dev-only: production provisioning never depends on the test fixture.
temper-testing = { path = "../temper-testing" }
serde_json.workspace = true
base64 = "0.22"

[lints]
workspace = true
