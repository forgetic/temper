[package]
name = "temper-agent-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The out-of-process coding-agent session: reads a workspace context, runs the native coding loop with checkpointing, writes the result. Ships the slim `temper-agent` binary; reused by the unified `temper agent` subcommand."

[dependencies]
async-trait = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
skein = { workspace = true }
temper-log = { path = "../temper-log" }
temper-agent = { path = "../temper-agent" }
temper-agent-core = { path = "../temper-agent-core" }
temper-agent-io = { path = "../temper-agent-io" }
temper-protocol-agent = { path = "../temper-protocol-agent" }

[[bin]]
name = "temper-agent"
path = "src/bin/temper-agent.rs"

[lints]
workspace = true
