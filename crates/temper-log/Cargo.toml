[package]
name = "temper-log"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Process-wide logging init for the temper binaries: env-aware tracing-subscriber setup (RUST_LOG, journald under systemd, ANSI-on-TTY stderr fmt)."

[features]
# OpenTelemetry projection — DISABLED by default. `otel` installs the layer and
# canonical activity projector; `otel-otlp` adds the OTLP/HTTP batch exporter.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
# Real OTLP/HTTP export through the standard OTEL_EXPORTER_OTLP_* variables.
otel-otlp = ["otel", "dep:opentelemetry-otlp"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
temper-protocol-activity = { path = "../temper-protocol-activity" }

# OpenTelemetry dependencies, built only for the features above.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

# The journald sink is Linux-only — `tracing-journald` does not build on other
# platforms. Gating the dependency per-target (paired with `#[cfg]` around the
# journald branch in lib.rs) keeps the crate compiling and warning-free off Linux.
[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
