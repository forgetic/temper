[package]
name = "harness-production"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Production-owned Harness worker and Forgejo provisioning binaries."

[[bin]]
name = "harness-worker"
path = "src/bin/harness-worker.rs"

[[bin]]
name = "harness-provision-forgejo"
path = "src/bin/harness-provision-forgejo.rs"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
harness-agents = { path = "../harness-agents" }
harness-forge = { path = "../harness-forge" }
harness-forge-forgejo = { path = "../harness-forge-forgejo" }
harness-runner = { path = "../harness-runner" }
harness-workflow = { path = "../harness-workflow" }
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time"] }

[lints]
workspace = true
