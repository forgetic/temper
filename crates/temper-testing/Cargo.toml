[package]
name = "temper-testing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable non-production testing machinery shared across Temper crates."

[[bin]]
name = "temper-testing-worker"
path = "src/bin/temper-testing-worker.rs"

[[bin]]
name = "temper-testing-daemon-worker"
path = "src/bin/temper-testing-daemon-worker.rs"

[[bin]]
name = "temper-forgejo-fixture"
path = "src/bin/temper-forgejo-fixture.rs"

# Compiled process fixture and custom early-main driver for the Linux
# descendant-containment acceptance matrix. The driver dispatches the private
# supervisor helper before running production APIs; no test invokes Cargo.
[[bin]]
name = "temper-descendant-fixture"
path = "src/bin/temper-descendant-fixture.rs"

[[bin]]
name = "temper-containment-acceptance"
path = "src/bin/temper-containment-acceptance.rs"

# Early-main supervisor dispatcher selected explicitly by the hermetic
# ownership-loss matrix. Referencing CARGO_BIN_EXE from the integration test
# makes Cargo/nextest build it even for a focused test filter and fresh target.
[[bin]]
name = "temper-real-stack-supervisor-helper"
path = "src/bin/temper-real-stack-supervisor-helper.rs"
test = false

# Public-standalone capstone fixture. The root package declares the same
# self-contained source as a test-only compiled target so its integration test
# can inject an exact path without recursive Cargo or ambient backend selectors.
[[bin]]
name = "temper-standalone-descendant-fixture"
path = "src/bin/temper-standalone-descendant-fixture.rs"
test = false

[dependencies]
async-trait.workspace = true
chrono.workspace = true
fs2.workspace = true
tracing = { workspace = true }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
toml.workspace = true
temper-forge-model = { path = "../temper-forge-model" }
temper-forge-filesystem = { path = "../temper-forge-filesystem" }
temper-forge-forgejo = { path = "../temper-forge-forgejo" }
bench-forgejo = { git = "https://git.ekanayaka.io/ai/bench.git", rev = "174d0d7a8eddc0c68f39bb9c34b79c70f6657554" }
temper-forge-memory = { path = "../temper-forge-memory" }
# Hermetic real-stack fixture builders compose the real daemon, in-process
# daemon transport, worker loop, CodingExecutor, and native agent behind a Jig
# fake LLM. Keeping this cross-tier wiring in temper-testing avoids making core
# worker crates depend on engine/agent implementations.
temper-engine = { path = "../temper-engine" }
# Restart regressions invoke the exported production startup inventory and
# orphan-convergence path instead of maintaining a fixture-only reconstruction.
temper-engine-service = { path = "../temper-engine-service" }
temper-daemon-transport = { path = "../temper-daemon-transport" }
temper-worker = { path = "../temper-worker" }
temper-worker-io = { path = "../temper-worker-io" }
temper-process-containment = { path = "../temper-process-containment" }
temper-agent-core = { path = "../temper-agent-core" }
temper-agent = { path = "../temper-agent" }
tongs.workspace = true
temper-protocol-agent = { path = "../temper-protocol-agent" }
temper-protocol-activity = { path = "../temper-protocol-activity" }
jig-core = { git = "https://git.ekanayaka.io/ai/jig.git", rev = "ca1edfd" }
jig-server = { git = "https://git.ekanayaka.io/ai/jig.git", rev = "ca1edfd" }
tempfile.workspace = true
# Reuse the generalized workflow loader (`load_workflow`/`resolve_workflow`) and
# the workflow-derived runner config (`runner_config_for`) behind the worker's
# runtime `--workflow` flag, rather than duplicating them here.
temper-reference-delivery = { path = "../temper-reference-delivery" }
temper-scenario-core = { path = "../temper-scenario-core" }
temper-runner = { path = "../temper-runner" }
temper-trigger-forgejo = { path = "../temper-trigger-forgejo" }
temper-wake = { path = "../temper-wake" }
# Wire-protocol DTOs for the deterministic daemon test worker
# (`daemon_worker` module + the `temper-testing-daemon-worker` bin).
temper-protocol-worker = { path = "../temper-protocol-worker" }
temper-workflow = { path = "../temper-workflow" }
# Forgejo provisioning drives async REST on the engine runtime; a shared
# fixture crate owns the blocking server/runner lifecycle and cache management.
sha2 = "0.10"
# Phase 2 provisioning commits workflow file(s) via the Forgejo contents API,
# which accepts base64-encoded bodies. Also used by ignored Forgejo smoke tests
# (a dev-dependency there too; a normal dependency here for provision.rs).
base64 = "0.22"
# The Forgejo backend (`ForgejoForge`) is async and its futures park on real
# network IO, so the `--backend forgejo` worker path (Phase 3) cannot use the
# crate's no-op `block_on`; it drives the poll loop as an engine task instead.
# The filesystem path keeps using `block_on`. This is a normal dependency (not
# dev-only) because the production binaries need the engine runtime.
skein.workspace = true
temper-engine-io = { path = "../temper-engine-io" }

[dev-dependencies]
# The hermetic real-stack retry regression shortens the agent-core provider
# retry backoff through test-support API while preserving the production retry
# classification path.
temper-agent-core = { path = "../temper-agent-core", features = ["test-support"] }
# The observability smoke test captures the runner's `temper-log` emit sites with
# a custom in-process layer and asserts on the structured fields + human message.
temper-log = { path = "../temper-log" }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
