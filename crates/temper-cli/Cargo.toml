[package]
name = "temper-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The unified `temper` command line: a thin dispatcher over the per-subcommand crates (init/config/daemon/agent) plus the hidden operator/responder tools."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Config (for EX_USAGE) + the per-subcommand crates the dispatcher delegates to.
temper-config = { path = "../temper-config" }
temper-cli-init = { path = "../temper-cli-init" }
temper-cli-config = { path = "../temper-cli-config" }
temper-cli-daemon = { path = "../temper-cli-daemon" }
temper-agent-session = { path = "../temper-agent-session" }

# Responder subcommands run the agent's external process-responders in-process.
temper-agent = { path = "../temper-agent" }
temper-agent-io = { path = "../temper-agent-io" }
temper-process-protocol = { path = "../temper-process-protocol" }

# Operator tools.
temper-provision-forgejo-cli = { path = "../temper-provision-forgejo-cli" }
temper-trigger-forgejo = { path = "../temper-trigger-forgejo" }
temper-reference-delivery-validator = { path = "../temper-reference-delivery-validator" }
temper-interaction-service = { path = "../temper-interaction-service" }

[lints]
workspace = true
