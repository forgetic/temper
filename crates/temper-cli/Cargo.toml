[package]
name = "temper-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The unified `temper` command line: the config/daemon/agent dispatcher, the standalone (all-in-one) daemon, the config subcommand, and the operator tools. The composition root that wires every tier together."

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skein = { workspace = true }

# Config + the three per-service crates (reused so standalone composes the same
# engine/worker the slim binaries run).
temper-config = { path = "../temper-config" }
temper-engine-service = { path = "../temper-engine-service" }
temper-worker-service = { path = "../temper-worker-service" }
temper-agent-session = { path = "../temper-agent-session" }

# In-process all-in-one glue spans all three tiers (composition root).
temper-engine = { path = "../temper-engine" }
temper-engine-io = { path = "../temper-engine-io" }
temper-forge = { path = "../temper-forge" }
temper-forge-forgejo = { path = "../temper-forge-forgejo" }
temper-workflow = { path = "../temper-workflow" }
temper-reference-delivery = { path = "../temper-reference-delivery" }
temper-worker = { path = "../temper-worker" }
temper-worker-protocol = { path = "../temper-worker-protocol" }
temper-agent = { path = "../temper-agent" }
temper-agent-io = { path = "../temper-agent-io" }
temper-agent-protocol = { path = "../temper-agent-protocol" }
temper-process-protocol = { path = "../temper-process-protocol" }

# Operator tools.
temper-forgejo-provision = { path = "../temper-forgejo-provision" }
temper-trigger-forgejo = { path = "../temper-trigger-forgejo" }
temper-reference-delivery-validator = { path = "../temper-reference-delivery-validator" }
temper-interaction-service = { path = "../temper-interaction-service" }

[lints]
workspace = true
