[package]
name = "temper-forge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Top-level Forge facade: re-exports the backend-agnostic model and offers a backend factory."

[dependencies]
# The backend-agnostic domain model + Forge trait. Re-exported wholesale so
# every consumer writes `temper_forge::Forge`, `temper_forge::Issue`, etc.
temper-forge-model = { path = "../temper-forge-model" }
# The concrete backends. This crate is the ONLY non-test crate allowed to depend
# on them: it constructs each behind `Arc<dyn Forge>` so callers never name a
# concrete backend handle.
temper-forge-forgejo = { path = "../temper-forge-forgejo" }
temper-forge-github = { path = "../temper-forge-github" }
temper-forge-memory = { path = "../temper-forge-memory" }
temper-forge-filesystem = { path = "../temper-forge-filesystem" }

[lints]
workspace = true
