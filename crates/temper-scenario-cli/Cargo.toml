[package]
name = "temper-scenario-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Command-line facade for listing, checking, running, validating, and drafting Temper scenario artifacts."

[dependencies]
