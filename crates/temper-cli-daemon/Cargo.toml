[package]
name = "temper-cli-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The `temper serve` runtime subcommands plus legacy `temper daemon` compatibility: run standalone or one engine/worker service. Carries the heavy engine/worker/agent wiring; the in-process agent runner lives here while the worker→daemon transport is shared via temper-daemon-transport."

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
skein = { workspace = true }
tracing = { workspace = true }

temper-config = { path = "../temper-config" }
temper-log = { path = "../temper-log" }
# Config + the three per-service crates (reused so standalone composes the same
# engine/worker the slim binaries run).
temper-engine-service = { path = "../temper-engine-service" }
temper-worker-service = { path = "../temper-worker-service" }
temper-agent-session = { path = "../temper-agent-session" }

# In-process all-in-one glue spans all three tiers (composition root).
temper-daemon-transport = { path = "../temper-daemon-transport" }
temper-engine = { path = "../temper-engine" }
temper-engine-io = { path = "../temper-engine-io" }
temper-forge = { path = "../temper-forge" }
temper-workflow = { path = "../temper-workflow" }
temper-reference-delivery = { path = "../temper-reference-delivery" }
temper-worker = { path = "../temper-worker" }
temper-protocol-worker = { path = "../temper-protocol-worker" }
temper-protocol-activity = { path = "../temper-protocol-activity" }
temper-agent = { path = "../temper-agent" }
temper-protocol-agent = { path = "../temper-protocol-agent" }

[dev-dependencies]
jig-core = { git = "https://git.ekanayaka.io/ai/jig.git", rev = "ca1edfd" }
jig-server = { git = "https://git.ekanayaka.io/ai/jig.git", rev = "ca1edfd" }
serde_json = { workspace = true }
tempfile = { workspace = true }
temper-worker-registry = { path = "../temper-worker-registry" }
tracing-subscriber = { workspace = true }
tongs.workspace = true

[lints]
workspace = true
