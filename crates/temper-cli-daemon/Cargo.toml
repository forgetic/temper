[package]
name = "temper-cli-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The `temper daemon` subcommand: run the full standalone (all-in-one) daemon, or one of its services (engine, worker). Carries the heavy engine/worker/agent wiring; the in-process transport + agent runner live here."

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
skein = { workspace = true }
tracing = { workspace = true }

temper-config = { path = "../temper-config" }
temper-log = { path = "../temper-log" }
# Config + the three per-service crates (reused so standalone composes the same
# engine/worker the slim binaries run).
temper-engine-service = { path = "../temper-engine-service" }
temper-worker-service = { path = "../temper-worker-service" }
temper-agent-session = { path = "../temper-agent-session" }

# In-process all-in-one glue spans all three tiers (composition root).
temper-engine = { path = "../temper-engine" }
temper-engine-io = { path = "../temper-engine-io" }
temper-forge = { path = "../temper-forge" }
temper-workflow = { path = "../temper-workflow" }
temper-reference-delivery = { path = "../temper-reference-delivery" }
temper-worker = { path = "../temper-worker" }
temper-protocol-worker = { path = "../temper-protocol-worker" }
temper-agent = { path = "../temper-agent" }
temper-protocol-agent = { path = "../temper-protocol-agent" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
