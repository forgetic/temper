[package]
name = "temper-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The temper-web server, read-model, SSE fan-out, and log-tail feed (PR D).
#
# Deliberately dependency-light: temper-web is a UI consumer / depgraph leaf, so
# it runs its OWN blocking `std::net` HTTP+SSE server (no skein, no async
# runtime — the daemon's one-shot H1 responder cannot hold a connection open for
# SSE). It depends only on serde for the wire types, temper-log for the event
# vocabulary it tails, and temper-workflow for lane derivation off the lifecycle
# state dimension. The blocking daemon HTTP client lives in the binary, not here.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
temper-log = { path = "../temper-log" }
temper-workflow = { path = "../temper-workflow" }

[lints]
workspace = true
