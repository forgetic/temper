[package]
name = "temper-forge-forgejo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Forgejo-backed Forge implementation (best-effort, offline-tested)."

[dependencies]
async-trait.workspace = true
chrono.workspace = true
temper-forge = { path = "../temper-forge" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
temper-workflow = { path = "../temper-workflow" }
# Only the optional, env-gated live smoke tests (`tests/live.rs`) need a real
# async runtime to drive `reqwest`; the offline tests use a hand-rolled poller.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
