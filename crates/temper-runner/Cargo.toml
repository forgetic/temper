[package]
name = "temper-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable backend-agnostic runner primitives for Temper."

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "process", "time"] }
temper-forge = { path = "../temper-forge" }
temper-process-protocol = { path = "../temper-process-protocol" }
temper-workflow = { path = "../temper-workflow" }

[dev-dependencies]
temper-forge-filesystem = { path = "../temper-forge-filesystem" }
temper-forge-memory = { path = "../temper-forge-memory" }
temper-testing = { path = "../temper-testing" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
