[package]
name = "harness-testing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable non-production testing machinery shared across Harness crates."

[[bin]]
name = "harness-testing-worker"
path = "src/bin/harness-testing-worker.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
harness-agents = { path = "../harness-agents" }
harness-production = { path = "../harness-production" }
harness-forge = { path = "../harness-forge" }
harness-forge-filesystem = { path = "../harness-forge-filesystem" }
harness-forge-forgejo = { path = "../harness-forge-forgejo" }
harness-forge-memory = { path = "../harness-forge-memory" }
harness-runner = { path = "../harness-runner" }
harness-workflow = { path = "../harness-workflow" }
# Forgejo end-to-end harness (env-gated, #[ignore]d): a blocking HTTP client to
# download the pinned server binary, verify its checksum, and poll readiness.
# `reqwest` is already in the workspace tree via `harness-forge-forgejo`; the
# `blocking` feature adds the sync API the one-shot download/boot harness uses,
# while the async API drives REST provisioning under a Tokio reactor (Phase 2).
reqwest = { workspace = true, features = ["blocking", "json"] }
sha2 = "0.10"
# Phase 2 provisioning commits workflow file(s) via the Forgejo contents API,
# which accepts base64-encoded bodies. Also used by the env-gated runner smoke
# test (a dev-dependency there too; a normal dependency here for provision.rs).
base64 = "0.22"
# The Forgejo backend (`ForgejoForge`) is async and its futures park on real
# network IO, so the `--backend forgejo` worker path (Phase 3) cannot use the
# crate's no-op `block_on`; it drives the poll loop on a current-thread Tokio
# runtime instead. The filesystem path keeps using `block_on`. This is a normal
# dependency (not dev-only) because the production binary needs the reactor; the
# `#[tokio::test]` provisioning tests reuse it via the `macros` feature.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
