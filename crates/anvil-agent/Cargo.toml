[package]
name = "anvil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sans-IO LLM agent loop for anvil: a pure AgentMachine driven by an asupersync shell that reuses pi-SDK providers and tools."

[dependencies]
async-trait = "0.1"
asupersync.workspace = true
futures = "0.3"
pi_agent_rust.workspace = true
serde.workspace = true
serde_json.workspace = true
anvil-io-engine = { path = "../anvil-io-engine" }

[dev-dependencies]
anvil-io-engine = { path = "../anvil-io-engine" }
anvil-temper-agent = { path = "../anvil-temper-agent", features = ["test-provider-base-url-override"] }
jig-server = { path = "../../../jig/crates/jig-server" }
jig-core = { path = "../../../jig/crates/jig-core" }

[lints]
workspace = true
