[package]
name = "temper-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Temper worker process: long-polls a Temper daemon and runs role/coding jobs. Speaks only the worker/daemon wire protocol; never calls the Forge API. (Formerly smith-worker.)"

[dependencies]
skein.workspace = true
temper-protocol-agent = { path = "../temper-protocol-agent" }
temper-protocol-activity = { path = "../temper-protocol-activity" }
tracing = { workspace = true }
temper-worker-io = { path = "../temper-worker-io" }
temper-process-containment = { path = "../temper-process-containment" }
temper-protocol-worker = { path = "../temper-protocol-worker" }
temper-scenario-core = { path = "../temper-scenario-core" }
temper-verdict = { path = "../temper-verdict" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
chrono.workspace = true
fs2.workspace = true
# NOTE: no tokio, anywhere. Production code and tests both run on the skein
# runtime; the transport e2e tests drive the real daemon through its in-process
# carrier rather than a tokio/axum fake. Keeping tokio out of the graph means
# non-test builds of this crate — and everything downstream — never pull it in.

[dev-dependencies]
async-trait = { workspace = true }
# Test-only cross-tier glue: proves the reusable in-process Daemon transport
# without making temper-worker depend on temper-engine in normal builds.
temper-daemon-transport = { path = "../temper-daemon-transport" }
temper-protocol-agent = { path = "../temper-protocol-agent" }
# Transport e2e tests drive the real daemon through its in-process carrier on the
# skein runtime (no fake daemon, no tokio/axum): the daemon now lives in this
# workspace, so tests run the real thing and tap the worker's posted result.
temper-engine = { path = "../temper-engine" }
temper-engine-io = { path = "../temper-engine-io" }
temper-agent = { path = "../temper-agent" }
temper-agent-core = { path = "../temper-agent-core" }
temper-log = { path = "../temper-log" }
temper-web = { path = "../temper-web" }
temper-forge = { path = "../temper-forge" }
temper-forge-memory = { path = "../temper-forge-memory" }
temper-worker-io = { path = "../temper-worker-io" }
tracing-subscriber = { workspace = true }
temper-workflow = { path = "../temper-workflow" }
secrecy.workspace = true
tongs.workspace = true

# A deterministic, hermetic agent that speaks the temper-protocol-agent: writes
# a product file and a terminal result. Lets the worker e2e drive the real
# out-of-process boundary without a cross-repo binary path or an LLM, via
# CARGO_BIN_EXE_temper-fake-agent.
[[bin]]
name = "temper-worker-containment-fixture"
path = "tests/support/worker_containment.rs"
test = false

[[bin]]
name = "temper-fake-agent"
path = "tests/support/smith_fake_agent.rs"
test = false

[lints]
workspace = true
