[package]
name = "temper-process-containment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prepared descendant-complete process-containment contract for Temper"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "linux_supervisor"
path = "tests/linux_supervisor.rs"
harness = false

[[test]]
name = "windows_job"
path = "tests/windows_job.rs"
harness = false

# This leaf is the sole OS FFI boundary and therefore cannot inherit the
# workspace-wide `unsafe_code = "forbid"`. Keep unsafe operations explicit.
[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
