[package]
name = "temper-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone async daemon serving the Worker/Daemon wire protocol over DaemonCore."

[dependencies]
axum = { workspace = true }
serde_json = { workspace = true }
temper-worker-protocol = { path = "../temper-worker-protocol" }
temper-worker-registry = { path = "../temper-worker-registry" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "signal"] }

[dev-dependencies]
reqwest = { workspace = true }

[[bin]]
name = "temper-daemon"
path = "src/bin/temper-daemon.rs"

[lints]
workspace = true
