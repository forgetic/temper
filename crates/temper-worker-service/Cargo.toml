[package]
name = "temper-worker-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The orchestration-worker service: wires a Resolved config into a long-polling worker that spawns out-of-process coding agents. Ships the slim `temper-worker` binary; reused by the unified binary's standalone mode."

[features]
default = []
otel = ["temper-log/otel-otlp"]

[dependencies]
skein = { workspace = true }
tracing = { workspace = true }
temper-log = { path = "../temper-log" }
temper-config = { path = "../temper-config" }
temper-worker = { path = "../temper-worker" }
temper-worker-io = { path = "../temper-worker-io" }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "temper-worker"
path = "src/bin/temper-worker.rs"

[lints]
workspace = true
