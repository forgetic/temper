[package]
name = "temper-cli-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The interactive `temper init` command: prompt for forge/admin/provider, write config.toml + workflow.yaml + a fresh webhook-secret + local credentials.toml, and optionally provision the forge when --apply is explicit. Orchestration only — config writing lives in temper-config, provisioning in temper-provision."

[dependencies]
temper-cli-common = { path = "../temper-cli-common" }
temper-config = { path = "../temper-config" }
temper-provision = { path = "../temper-provision" }
temper-forge = { path = "../temper-forge" }
temper-engine-io = { path = "../temper-engine-io" }
temper-workflow = { path = "../temper-workflow" }
temper-reference-delivery = { path = "../temper-reference-delivery" }
# Webhook-secret generation (two v4 UUIDs); a workspace dependency already in use.
uuid = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
