# Calibrated profiles for ignored/manual Forgejo/provider live tests.
#
# Root-package Forgejo e2es are assigned to the global `root-forgejo-e2e` test
# group with `max-threads = 1`, so nextest queues those heavyweight scenarios at
# the scheduler instead of starting several Forgejo / runner / daemon topologies
# in parallel. Each profile override also reserves all four e2e threads: daemon
# boot stretches otherwise compete with unrelated live fixtures and can exhaust
# their bounded startup window without producing a boot log. The advisory file
# lock in tests/support/e2e_lock.rs intentionally remains as belt-and-suspenders
# protection for direct `cargo test -- --ignored` invocations and older/manual
# runners that do not honor this nextest config. Keep the default profile's
# thread count unset so nextest runs the ordinary quick suite across all
# available CPUs. Resource-heavy exceptions below reserve the full scheduler
# explicitly instead of serializing unrelated tests.
[test-groups]
root-forgejo-e2e = { max-threads = 1 }
# Native-process acceptance starts real agents and worker/daemon worlds. Nextest
# runs each test in a separate process, so in-binary mutexes cannot prevent the
# resource-heavy descendant and restart fixtures from starving each other's
# short watchdog deadlines on shared CI hosts. The overrides reserve the global
# scheduler while each fixture runs; the group also documents their shared
# resource class and keeps the matrix serial if the profile's thread count is
# overridden.
native-process-fixtures = { max-threads = 1 }
# Restart-phase worlds use explicit lifecycle and watchdog synchronization, so
# four may safely divide an eight-thread host without timing-based contention.
restart-cancellation-fixtures = { max-threads = 8 }

[[profile.default.overrides]]
filter = 'package(temper-testing) & binary(hermetic_real_stack) & test(/^restart_cancellation::/)'
test-group = 'restart-cancellation-fixtures'
# Each synchronized helper world reserves two scheduler slots. The eight-slot
# group caps the matrix at four independent worlds while leaving ordinary tests
# room on larger hosts.
threads-required = 2
# Start the serialized slow path first so it overlaps the broad parallel suite
# instead of extending the critical path after short tests have drained.
priority = 100

[[profile.default.overrides]]
filter = 'package(temper-testing) & binary(hermetic_real_stack) & test(/^ownership_loss::/)'
test-group = 'native-process-fixtures'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(temper-testing) & binary(descendant_containment_acceptance)'
test-group = 'native-process-fixtures'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(temper) & binary(standalone_shutdown_forgejo_e2e)'
test-group = 'native-process-fixtures'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(temper-worker) & binary(temper_worker) & test(/^out_of_process_runner::supervisor_tests::/)'
test-group = 'native-process-fixtures'
threads-required = "num-cpus"

[profile.e2e]
test-threads = 4
fail-fast = false

# These suites start host-mode runners whose embedded cache server uses a
# host-global Bolt database. Run them without concurrent live fixtures so cache
# lock contention cannot leave their queued workflows unclaimed until timeout.
[[profile.e2e.overrides]]
filter = 'package(temper) & binary(standalone_shutdown_forgejo_e2e)'
test-group = 'native-process-fixtures'
threads-required = 4

[[profile.e2e.overrides]]
filter = '''
(package(temper-testing) & binary(forgejo_runner)) |
(package(temper-forge-forgejo) & binary(live))
'''
threads-required = 4

# The Forgejo backend live tests each start another host-mode runner against the
# same host-global cache. Reserve the scheduler so their workflows cannot be
# stranded behind a concurrently-owned runner cache.
[[profile.e2e.overrides]]
filter = 'package(temper-forge-forgejo) & binary(live)'
threads-required = 4

[[profile.e2e.overrides]]
filter = 'package(temper) & (binary(basic_delivery_forgejo_e2e) | binary(daemon_forgejo_e2e) | binary(init_forgejo_e2e))'
test-group = 'root-forgejo-e2e'
threads-required = 4

# Everyday full runs use this narrower live lane after the non-ignored quick
# suite. Keep the list exact and readable: adding/removing a default live
# capstone should be a deliberate edit here, not a side effect of adding an
# arbitrary new #[ignore] test. The checkpoint→PR handoff and provider
# server-error retry paths are covered by hermetic real-stack tests in
# temper-testing, so the former `temper run` live e2es are no longer in any live
# lane.
[profile.e2e-capstones]
test-threads = 4
fail-fast = false
default-filter = '''
package(temper) & (
    (binary(daemon_forgejo_e2e) & test(/^daemon_forgejo_bare_failure_requires_recovery$/)) |
    (binary(init_forgejo_e2e) & test(/^init_forgejo_drives_a_working_setup$/))
)
'''

[[profile.e2e-capstones.overrides]]
filter = 'package(temper) & (binary(daemon_forgejo_e2e) | binary(init_forgejo_e2e))'
test-group = 'root-forgejo-e2e'
threads-required = 4
