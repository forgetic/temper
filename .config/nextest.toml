# Calibrated profile for every ignored/manual Forgejo/provider live test. The
# heavyweight root Forgejo scenarios self-serialize with the advisory lock in
# tests/support/e2e_lock.rs, so the nextest scheduler can use the same four
# threads for all ignored integration tests while lock holders run one at a time.
[profile.e2e]
test-threads = 4
fail-fast = false

# Everyday full runs use this narrower live lane after the non-ignored quick
# suite. Keep the list exact and readable: adding/removing a default live
# capstone should be a deliberate edit here, not a side effect of adding an
# arbitrary new #[ignore] test. The checkpointed standalone `temper run` story
# remains in the manual/all-e2e lane; its checkpoint→PR handoff is covered by
# the hermetic real-stack test in temper-testing.
[profile.e2e-capstones]
test-threads = 4
fail-fast = false
default-filter = '''
package(temper) & (
    (binary(daemon_forgejo_e2e) & test(/^daemon_forgejo_ci_fails_then_passes_converges$/)) |
    (binary(init_forgejo_e2e) & test(/^init_forgejo_drives_a_working_setup$/))
)
'''

