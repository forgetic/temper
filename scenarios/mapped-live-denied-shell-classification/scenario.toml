schema = "temper.scenario.v1"
name = "mapped-live-denied-shell-classification"
status = "active"
intent = "Validate feature #1082's privacy-safe complete classification for a shell barrier denied locally after same-turn graph discovery, while preserving later current-root convergence."
introduced_by = "#1086"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#1082"
plan = "ai/temper#1083"
source_branch = "agent/pr-for-feature-1082"
change = "new"

[feature_contract]
claim = "A never-executed shell barrier denied after same-turn graph discovery retains complete trusted classification as one closed excluded disposition with zero discovery segments, without invalidating the successful graph decision anchor."
stimulus = "Run one engineer repair through real Forgejo, a host Actions runner, standalone Temper, Jig, and a deterministic current-root provider; in the first model turn issue graph discovery followed by a shell process barrier, then consume the successful root through implementation, caller/model, and focused-test evidence in later turns."
observable = "An argument-free closed shell start; policy_denial and policy_precondition completion; zero-duration and process-canary non-execution facts; complete graph lineage and typed evidence; one exact repair; host validation; Actions success; merge; and issue closure."
assertion = "The graph result completes before the serialized shell barrier is denied locally as DecisionAnchorMutation; the paired shell lifecycle remains complete with excluded_never_executed_local_policy_denial and zero segments; no process executes; and the same root remains valid for the later current-root chain and convergent repair."
runtime_budget_seconds = 600
jig_script_path = "jig/mapped-live-denied-shell-classification.json"

[observability]
log_format = "json"
rust_log = "temper=debug"

[live_harness]
ci_poll_cadence = "1s"
poll_cadence = "1s"
mechanical_cadence = "1s"

[topology]
kind = "single-repo-forgejo-standalone"
forge = "forgejo"
runner = "forgejo-actions-host"
temper = "standalone"
agent_model = "scripted-fake-llm"
repos = ["service"]

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Preserve selected retry behavior after a locally denied shell barrier"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[agents]]
role = "engineer"
kind = "llm"
mode = "scripted-fake"
tool = "coding_workspace"
queues = ["code_ready"]

[[agents]]
role = "mechanical"
kind = "built-in"
mode = "automation"
queues = ["landing"]

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-demo-project"
lifecycle_profile = "mapped-live-denied-shell-classification"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/mapped-live-denied-shell-classification.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "the engineer observes the same-turn graph result before a locally denied shell barrier, consumes that root through later implementation, caller/model, and focused-test evidence, proves the process canary absent, applies one minimal repair, passes host validation and Actions, merges the PR, and closes the source issue"

[expect]
outcome = "The live agent retains complete zero-credit shell classification and proves no process execution, while the preceding graph root remains authoritative for a later complete current-root chain and one convergent repair."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-exact-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.events]]
required = true
id = "denied-shell-start-retains-only-closed-exclusion"
event = "tool.start"
fields.tool = "bash"
fields.id = "denied-shell-process-canary"
fields."tool.arguments.present" = false
fields."tool.shell_discovery_disposition.version" = 1
fields."tool.shell_discovery_disposition.status" = "excluded_never_executed_local_policy_denial"
fields."tool.shell_discovery_disposition.matching_discovery_segments" = 0

[[expect.events]]
required = true
id = "denied-shell-completion-retains-policy-precondition"
event = "tool.error"
fields.tool = "bash"
fields.id = "denied-shell-process-canary"
fields.duration_ms = 0
fields."tool.failure.category" = "policy_denial"
fields."tool.failure.reason" = "policy_precondition"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false

[[expect.events]]
required = true
id = "caller-model-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.decision_evidence_kind" = "caller"

[[expect.events]]
required = true
id = "focused-test-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.decision_evidence_kind" = "focused_test"

[[expect.events]]
required = true
id = "process-canary-and-repair-validation-succeed"
event = "tool.end"
fields.tool = "bash"
fields.id = "validate-repair-and-process-canary"

[[expect.events]]
required = true
id = "host-submission-succeeds"
event = "tool.end"
fields.tool = "submit_for_pr"
fields.id = "submit-denied-shell-classification-repair"

[[expect.sequence]]
required = true
id = "denied-shell-classification-before-later-anchor-consumption"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.lineage.complete" = true, "graph.lineage.version" = 1, "graph.lineage.stage" = "root" } },
  { event = "tool.start", fields = { tool = "bash", id = "denied-shell-process-canary", "tool.arguments.present" = false, "tool.shell_discovery_disposition.status" = "excluded_never_executed_local_policy_denial", "tool.shell_discovery_disposition.matching_discovery_segments" = 0 } },
  { event = "tool.error", fields = { tool = "bash", id = "denied-shell-process-canary", "tool.failure.category" = "policy_denial", "tool.failure.reason" = "policy_precondition" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "caller" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "tool.start", fields = { tool = "read", id = "read-selected-source-after-complete-chain" } },
  { event = "tool.end", fields = { tool = "write", id = "write-minimal-denied-shell-repair" } },
  { event = "tool.end", fields = { tool = "bash", id = "validate-repair-and-process-canary" } },
  { event = "tool.end", fields = { tool = "submit_for_pr", id = "submit-denied-shell-classification-repair" } },
  { event = "workspace.diff.produced", fields = { changed_count = 1 } },
]

[[expect.count]]
required = true
id = "five-complete-v1-correlations-and-lineages"
event = "mcp.tool.result"
fields.is_error = false
fields."graph.correlation.complete" = true
fields."graph.correlation.version" = 1
fields."graph.lineage.complete" = true
fields."graph.lineage.version" = 1
exactly = 5

[[expect.count]]
required = true
id = "one-excluded-denied-shell-start"
event = "tool.start"
fields.tool = "bash"
fields."tool.shell_discovery_disposition.status" = "excluded_never_executed_local_policy_denial"
fields."tool.shell_discovery_disposition.matching_discovery_segments" = 0
exactly = 1

[[expect.count]]
required = true
id = "one-paired-policy-denial"
event = "tool.error"
fields.tool = "bash"
fields."tool.failure.category" = "policy_denial"
fields."tool.failure.reason" = "policy_precondition"
exactly = 1

[[expect.count]]
required = true
id = "one-provider-root-not-two"
event = "mcp.tool.called"
fields."mcp.tool" = "search_graph"
exactly = 1

[[expect.count]]
required = true
id = "one-dependent-implementation-refinement"
event = "mcp.tool.called"
fields."mcp.tool" = "search_code"
exactly = 1

[[expect.count]]
required = true
id = "one-dependent-caller-trace"
event = "mcp.tool.called"
fields."mcp.tool" = "trace_path"
exactly = 1

[[expect.count]]
required = true
id = "two-current-root-source-reads"
event = "mcp.tool.called"
fields."mcp.tool" = "get_code_snippet"
exactly = 2

[[expect.count]]
required = true
id = "no-broad-architecture-call"
event = "mcp.tool.called"
fields."mcp.tool" = "get_architecture"
exactly = 0

[expect.effective_configuration]
id = "rapid-denied-shell-classification-harness-cadence"
ci_poll_cadence_secs = 1
poll_cadence_secs = 1
mechanical_cadence_secs = 1

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/demo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "one first-turn graph root followed by a serialized locally denied shell barrier; one closed excluded zero-segment disposition and paired policy completion; later implementation refinement, caller trace, typed caller/model and focused-test current-root sources; process-canary non-execution; exact repair and gates; privacy-safe aggregate facts only"
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Tighten closed disposition, zero-segment, non-execution, lineage, count, ordering, or convergence assertions.",
  "Update generic privacy-safe lifecycle observability without retaining invocation data or diagnostic content.",
]
requires_new_scenario_or_major_update = [
  "Allowing the locally denied shell barrier to reach process execution or lose complete classification.",
  "Invalidating the successful graph anchor or allowing mutation before the later current-root evidence chain is complete.",
  "Retaining raw commands, arguments, source, paths, provider output, prompts, credentials, fingerprints, host output, or diagnostic traces in scenario or aggregate evidence.",
  "Replacing the mandatory live Forgejo/Actions/standalone-Temper/Jig topology with a lower-level test.",
]
