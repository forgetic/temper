schema = "temper.scenario.v1"
name = "mapped-live-decision-gap-recovery"
status = "active"
intent = "Validate feature #1069's bounded decision-gap recovery and feature #1091's root-coherent, progress-based strengthening through provider-free local denials, one minimal live repair, and safe no-product exhaustion."
introduced_by = "#1075"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/mapped-live-graph-consumption"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#1069"
plan = "ai/temper#1070"
source_branch = "agent/pr-for-feature-1069"
change = "new"

[feature_contract]
claim = "Bounded decision-gap recovery is root-local and progress-based: only calls admitted for the immutable active-root snapshot can reach the provider or spend allowance, while an impossible remaining gap terminates safely without a product."
stimulus = "Run one engineer repair through real Forgejo, a host Actions runner, standalone Temper, Jig, and a deterministic current-root provider; establish distinct routing and behavioral roots, exhaust normal exploration on the sibling root, submit a mixed cross-root recovery batch around one compatible active-root trace, then complete the active root with three typed sources."
observable = "Distinct typed roots; one #1082-compatible locally denied shell lifecycle; immutable mixed-batch denials; exact four-kind then three-kind diagnostics with allowance four then three; eight provider reads in completion-order-independent batches; one exact repair; host validation; Actions success; merge; issue closure; and a closed no-compatible-action stop_without_product variant."
assertion = "Two sibling focused-test reads exhaust normal exploration without advancing the active routing root; both cross-root recovery calls stay local and spend nothing while the active trace reaches MCP; trace progress leaves implementation, caller, and focused_test with allowance three; three active-root sources complete the chain regardless of completion order; one satisfied trace and three post-completion calls stay local; exactly one mutation lands; and impossible recovery has no denial loop or landable product."
runtime_budget_seconds = 600
jig_script_path = "jig/mapped-live-decision-gap-recovery.json"

[observability]
log_format = "json"
rust_log = "temper=debug"

[live_harness]
ci_poll_cadence = "1s"
poll_cadence = "1s"
mechanical_cadence = "1s"

[topology]
kind = "single-repo-forgejo-standalone"
forge = "forgejo"
runner = "forgejo-actions-host"
temper = "standalone"
agent_model = "scripted-fake-llm"
repos = ["service"]

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Recover active-root evidence after graph budget exhaustion"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-demo-project"
lifecycle_profile = "mapped-live-decision-gap-recovery"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/mapped-live-decision-gap-recovery.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "the engineer observes immutable cross-root denials and exact trace-progress guidance, completes the active-root source chain, observes local graph closure, applies one exact repair, passes host validation and Actions, merges the PR, and closes the source issue"

[expect]
outcome = "The live agent spends recovery allowance only on four active-root calls, updates the actual missing set after trace progress, completes one exact repair, and converges while cross-root, satisfied, and post-completion calls remain provider-free and impossible recovery remains a safe no-product terminal."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-exact-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.events]]
required = true
id = "denied-shell-start-retains-closed-exclusion"
event = "tool.start"
fields.tool = "bash"
fields.id = "denied-shell-process-canary"
fields."tool.arguments.present" = false
fields."tool.shell_discovery_disposition.version" = 1
fields."tool.shell_discovery_disposition.status" = "excluded_never_executed_local_policy_denial"
fields."tool.shell_discovery_disposition.matching_discovery_segments" = 0

[[expect.events]]
required = true
id = "denied-shell-completion-is-policy-precondition"
event = "tool.error"
fields.tool = "bash"
fields.id = "denied-shell-process-canary"
fields.duration_ms = 0
fields."tool.failure.category" = "policy_denial"
fields."tool.failure.reason" = "policy_precondition"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false

[[expect.events]]
required = true
id = "immutable-cross-root-recovery-diagnostic"
event = "tool.error"
fields.tool = "codebase_memory_get_code_snippet"
fields.id = "recovery-cross-root-caller-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.retry_disposition" = "correct_invocation"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.reason" = "recoverable_incomplete_evidence"
fields."tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 4

[[expect.events]]
required = true
id = "trace-progress-reports-actual-remaining-kinds"
event = "tool.error"
fields.tool = "codebase_memory_trace_path"
fields.id = "recovery-satisfied-trace-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.retry_disposition" = "correct_invocation"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.reason" = "recoverable_incomplete_evidence"
fields."tool.failure.graph.missing_evidence" = "implementation,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 3

[[expect.events]]
required = true
id = "active-root-implementation-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "implementation"

[[expect.events]]
required = true
id = "active-root-caller-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "caller"

[[expect.events]]
required = true
id = "focused-test-purpose-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.decision_evidence_kind" = "focused_test"

[[expect.sequence]]
required = true
id = "root-coherent-progress-before-one-exact-repair"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.lineage.stage" = "root" } },
  { event = "tool.start", fields = { tool = "bash", id = "denied-shell-process-canary", "tool.arguments.present" = false, "tool.shell_discovery_disposition.status" = "excluded_never_executed_local_policy_denial", "tool.shell_discovery_disposition.matching_discovery_segments" = 0 } },
  { event = "tool.error", fields = { tool = "bash", id = "denied-shell-process-canary", "tool.failure.category" = "policy_denial", "tool.failure.reason" = "policy_precondition" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.lineage.stage" = "root" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.stage" = "carry_forward" } },
  { event = "tool.error", fields = { id = "recovery-satisfied-trace-denied", "tool.failure.graph.missing_evidence" = "implementation,caller,focused_test", "tool.failure.graph.remaining_allowance" = 3 } },
  { event = "tool.error", fields = { id = "post-completion-broad-search-denied", "tool.failure.reason" = "exploration_closed", "tool.failure.graph.reason" = "completed" } },
  { event = "tool.start", fields = { tool = "bash", id = "classify-compound-shell-discovery", "tool.arguments.present" = true } },
  { event = "tool.start", fields = { tool = "read", id = "read-route-after-recovery" } },
  { event = "tool.end", fields = { tool = "apply_patch", id = "patch-retry-affinity-after-recovery" } },
  { event = "tool.end", fields = { tool = "bash", id = "validate-exact-recovered-repair" } },
  { event = "tool.end", fields = { tool = "submit_for_pr", id = "submit-recovered-minimal-repair" } },
  { event = "workspace.diff.produced", fields = { changed_count = 1 } },
]

[[expect.count]]
required = true
id = "eight-complete-v1-lineages"
event = "mcp.tool.result"
fields.is_error = false
fields."graph.correlation.complete" = true
fields."graph.correlation.version" = 1
fields."graph.lineage.complete" = true
fields."graph.lineage.version" = 1
exactly = 8

[[expect.count]]
required = true
id = "two-independent-roots"
event = "mcp.tool.result"
fields.is_error = false
fields."graph.lineage.stage" = "root"
exactly = 2

[[expect.count]]
required = true
id = "two-provider-roots-not-three"
event = "mcp.tool.called"
fields."mcp.tool" = "search_graph"
exactly = 2

[[expect.count]]
required = true
id = "no-provider-refinement"
event = "mcp.tool.called"
fields."mcp.tool" = "search_code"
exactly = 0

[[expect.count]]
required = true
id = "one-provider-trace"
event = "mcp.tool.called"
fields."mcp.tool" = "trace_path"
exactly = 1

[[expect.count]]
required = true
id = "five-provider-sources-with-no-cross-root-recovery-invocation"
event = "mcp.tool.called"
fields."mcp.tool" = "get_code_snippet"
exactly = 5

[[expect.count]]
required = true
id = "two-cross-root-local-denials-share-pre-batch-snapshot"
event = "tool.error"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 4
exactly = 2

[[expect.count]]
required = true
id = "one-satisfied-trace-local-denial-after-progress"
event = "tool.error"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.graph.missing_evidence" = "implementation,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 3
exactly = 1

[[expect.count]]
required = true
id = "three-post-completion-local-denials"
event = "tool.error"
fields."tool.failure.reason" = "exploration_closed"
fields."tool.failure.graph.reason" = "completed"
exactly = 3

[[expect.count]]
required = true
id = "one-excluded-denied-shell-start"
event = "tool.start"
fields.tool = "bash"
fields."tool.shell_discovery_disposition.status" = "excluded_never_executed_local_policy_denial"
fields."tool.shell_discovery_disposition.matching_discovery_segments" = 0
exactly = 1

[[expect.count]]
required = true
id = "one-minimal-mutation"
event = "tool.end"
fields.tool = "apply_patch"
exactly = 1

[[expect.count]]
required = true
id = "one-host-submission"
event = "tool.end"
fields.tool = "submit_for_pr"
exactly = 1

[expect.effective_configuration]
id = "rapid-decision-gap-recovery-harness-cadence"
ci_poll_cadence_secs = 1
poll_cadence_secs = 1
mechanical_cadence_secs = 1

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/demo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "historical #1069/#1070 mapping strengthened by #1091; ordered active routing root plus independent behavioral root; two sibling focused-test reads; immutable mixed recovery batch with two cross-root local denials and one admitted trace; actual implementation/caller/focused_test gaps with allowance three; completion-order-independent active-root source batch; one satisfied trace denial; three local completion denials; one #1082 shell exclusion; exact repair and host gate; no-compatible-action stop_without_product; privacy-safe aggregate checkpoints only"
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Tighten closed root-coherence, missing-kind, permitted-action, allowance, provider-count, typed-evidence, shell-classification, or convergence assertions.",
  "Update generic privacy-safe lifecycle observability without retaining provider values or diagnostic traces.",
]
requires_new_scenario_or_major_update = [
  "Allowing cross-root, satisfied, broad, duplicate, or post-completion recovery attempts to reach the provider or spend active-root allowance.",
  "Allowing recovery exhaustion to produce mutation or a landable-looking product.",
  "Retaining raw tool inputs, selectors, roots, provider output, source, prompts, commands, credentials, host-gate output, paths, or diagnostic traces.",
  "Replacing the mandatory live Forgejo/Actions/standalone-Temper/Jig topology with a lower-level test.",
]
