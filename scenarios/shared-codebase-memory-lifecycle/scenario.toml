schema = "temper.scenario.v1"
name = "shared-codebase-memory-lifecycle"
status = "active"
intent = "Cancel the first real job without interrupting a surviving job's shared provider work."
introduced_by = "#1280"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/codebase-memory-graph-consumption"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#1280"
plan = "ai/temper#1278"
source_branch = "agent/pr-for-feature-1280"
change = "new"

[feature_contract]
claim = "A first-party job's ownership-loss cancellation preserves the surviving job's shared daemon and service work, with natural final-session cleanup."
stimulus = "Cold-start A through ordinary parent bootstrap, activate B, revoke A's real Forgejo assignment and lease, then release B's graph query after completed A containment."
observable = "Distinct overlapping A/B attempts, continuous admission, one daemon/work identity, A recursive emptiness, exact B source consumption after cancellation, real CI merge, and natural final provider/helper exit before standalone teardown."
assertion = "Correlated runtime checks and required retained facts prove lifecycle ordering; successful typed graph source, ordinary read and mutation remain ordered before host validation and CI."
runtime_budget_seconds = 600
jig_script_path = "jig/shared-codebase-memory-lifecycle.json"

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "owner"
repo = "service"
kind = "code"
title = "Withdraw the initial shared provider owner"
body = "config/owner-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Preserve retry affinity using the surviving provider session"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code"]
created_after = "standalone_ready"

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Provision real Forgejo."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register the real host Actions runner."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "shared-lifecycle-project"
lifecycle_profile = "shared-codebase-memory-lifecycle"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 0

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 10
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/shared-codebase-memory-lifecycle.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-owner-issue"
action = "issue.seed"
issue_id = "owner"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "A's production containment completes, the same B attempt consumes surviving shared service source and merges through host CI, and final provider/helper cleanup completes before standalone stops"

[expect]
outcome = "The surviving job completes through real CI after first-owner cancellation, then the last session and helper exit naturally."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "survivor-issue-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "survivor-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "survivor-diff-landed"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.sequence]]
required = true
id = "first-owner-cancel-before-survivor-source-and-repair"
events = [
  { event = "worker.job.cancellation_requested", fields = { timeout_reason = "ownership_lost" } },
  { event = "worker.containment.cleanup_completed", fields = { owner_kind = "mcp_server", recursive_empty = "proven", direct_child_reap = "reaped" } },
  { event = "worker.job.cancellation_completed" },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", "graph.lineage.decision_evidence_kind" = "implementation", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", "graph.lineage.decision_evidence_kind" = "caller", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", "graph.lineage.decision_evidence_kind" = "focused_test", is_error = false } },
  { event = "tool.end", fields = { tool = "read", id = "lifecycle-b-ordinary-read" } },
  { event = "tool.start", fields = { tool = "write", id = "lifecycle-b-repair" } },
  { event = "workspace.diff.produced" },
]

[[expect.count]]
required = true
id = "exactly-one-ownership-cancellation"
event = "worker.job.cancellation_requested"
fields.timeout_reason = "ownership_lost"
exactly = 1

[[assertions]]
id = "correlated-shared-lifecycle-and-natural-cleanup"
kind = "command"
phase = "after-convergence"
command = "assertions/lifecycle.sh"
timeout_ms = 5000
required = true

[observability]
log_format = "json"
rust_log = "info,temper=debug"

[latency_budget]
startup = "90s"
convergence = "6m"
poll_backstop = "10m"

[live_harness]
poll_cadence = "1s"
ci_poll_cadence = "1s"
mechanical_cadence = "1s"
poll_backstop = "10m"
