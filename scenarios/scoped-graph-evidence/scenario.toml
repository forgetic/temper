schema = "temper.scenario.v1"
name = "scoped-graph-evidence"
status = "active"
intent = "Validate scoped graph coverage and attributed child handoff before policy-compliant editing."
introduced_by = "#1279"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/mapped-live-decision-gap-recovery"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#1279"
plan = "ai/temper#1278"
source_branch = "agent/pr-for-feature-1279"
change = "new"

[feature_contract]
claim = "Scoped coverage remains diagnostic after discovery converges, preserving current project/generation and pagination; filesystem-only children receive bounded attributed evidence without source or mutation authority."
stimulus = "Consume implementation, caller and focused-test graph sources; check cited paths and explicit scopes; delegate bounded Verify context; revalidate before and after the child; read the exact parent target and repair."
observable = "Ordered current-root source evidence, clean bounded coverage, child ordinary source consumption, revalidated handoff with limitations, parent ordinary read, minimal patch, host validation, Actions CI, merge and closure."
assertion = "Coverage follows graph convergence and precedes the child; child findings retain limitations and revalidate; only the parent ordinary exact read precedes the minimal mutation. Six bounded provider coverage calls confirm the initial receipt and both child boundaries."
runtime_budget_seconds = 600
jig_script_path = "jig/scoped-graph-evidence.json"

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Verify scoped graph evidence and child handoff before retry-affinity repair"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-demo-project"
lifecycle_profile = "mapped-live-focused-test-source-relevance"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "check_index_coverage"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/scoped-graph-evidence.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "graph sources converge, scoped coverage and child handoff revalidate, parent exact source read authorizes only the minimal repair, host validation and CI pass, and the source issue closes"

[expect]
outcome = "Coverage and bounded child evidence are consumed and revalidated after graph convergence, then the parent exact read and minimal repair converge through real Actions CI."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-exact-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.events]]
required = true
id = "implementation-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "implementation"

[[expect.events]]
required = true
id = "caller-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "caller"

[[expect.events]]
required = true
id = "exact-focused-test-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.complete" = true
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "focused_test"

[[expect.count]]
required = true
id = "five-complete-v1-lineages"
event = "mcp.tool.result"
fields.is_error = false
fields."graph.correlation.complete" = true
fields."graph.correlation.version" = 1
fields."graph.lineage.complete" = true
fields."graph.lineage.version" = 1
exactly = 5

[[expect.count]]
required = true
id = "one-targeted-semantic-search"
event = "mcp.tool.called"
fields."mcp.tool" = "search_graph"
exactly = 1

[[expect.count]]
required = true
id = "one-inbound-caller-trace"
event = "mcp.tool.called"
fields."mcp.tool" = "trace_path"
exactly = 1

[[expect.count]]
required = true
id = "three-exact-source-consumers"
event = "mcp.tool.called"
fields."mcp.tool" = "get_code_snippet"
exactly = 3

[[expect.count]]
required = true
id = "one-minimal-mutation"
event = "tool.end"
fields.tool = "apply_patch"
exactly = 1

[[expect.count]]
required = true
id = "one-host-submission"
event = "tool.end"
fields.tool = "submit_for_pr"
exactly = 1

[expect.effective_configuration]
id = "rapid-scoped-evidence-harness-cadence"
ci_poll_cadence_secs = 1
poll_cadence_secs = 1
mechanical_cadence_secs = 1

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "index_repository", "delete_project", "check_index_coverage"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_list_projects", "codebase_memory_index_status", "codebase_memory_check_index_coverage"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/demo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "Current-root implementation/caller/focused-test chain; post-convergence cited-path and scope coverage; attributed Verify child source consumption; generation/source revalidation; parent exact read and minimal repair."
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Tighten bounded coverage, freshness, pagination, attributed handoff, ordinary-read ordering, source-consumption, provider-count, privacy or convergence assertions.",
  "Update generic privacy-safe observability without retaining selectors, roots, source, provider payloads, or traces.",
]
requires_new_scenario_or_major_update = [
  "Allowing coverage or child findings to create lineage/source authority, satisfy the parent ordinary read, reopen discovery or increase retry budgets.",
  "Allowing stale, partial, cross-checkout or cross-generation handoff receipts to support broader claims or silent reuse.",
  "Retaining raw prompts, selectors, roots, source, provider output, credentials, host-gate output, or diagnostic traces.",
  "Replacing the mandatory live Forgejo/Actions/standalone-Temper/Jig topology with a lower-level test.",
]

[[expect.events]]
required = true
id = "coverage-after-convergence"
event = "codebase_memory.coverage"
fields."coverage.status" = "clean"
fields."coverage.pagination_complete" = true

[[expect.events]]
required = true
id = "child-evidence-revalidated"
event = "codebase_memory.handoff"
fields."handoff.status" = "revalidated"

[[expect.count]]
required = true
id = "bounded-coverage-provider-checks"
event = "mcp.tool.called"
fields."mcp.tool" = "check_index_coverage"
exactly = 6

[[expect.sequence]]
required = true
id = "coverage-child-parent-read-before-repair"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", "graph.lineage.stage" = "root", "graph.lineage.focused_test_discovery" = "eligible_selector_returned", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", "graph.lineage.decision_evidence_kind" = "implementation", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", "graph.lineage.stage" = "carry_forward", "graph.lineage.complete" = true, is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", "graph.lineage.decision_evidence_kind" = "caller", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", "graph.lineage.decision_evidence_kind" = "focused_test", is_error = false } },
  { event = "codebase_memory.coverage", fields = { "coverage.status" = "clean", "coverage.pagination_complete" = true } },
  { event = "tool.end", fields = { tool = "read", id = "child-consumes-source" } },
  { event = "codebase_memory.handoff", fields = { "handoff.status" = "revalidated" } },
  { event = "tool.end", fields = { tool = "read", id = "read-route-after-focused-relevance" } },
  { event = "tool.start", fields = { tool = "apply_patch", id = "patch-route-after-focused-relevance" } },
  { event = "workspace.diff.produced" },
]
