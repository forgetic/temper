schema = "temper.scenario.v1"
name = "mapped-live-exact-source-selection"
status = "active"
intent = "Validate feature #1210's deterministic root-local decision-evidence convergence before one post-source exact read and matching minimal mutation."
introduced_by = "#1144"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/mapped-live-focused-test-source-relevance"

[runner]
uses = "manifest"

# Historical mapping audit: feature ai/temper#1151, plan ai/temper#1152, and
# source branch agent/pr-for-feature-1151. The introduced_by provenance is unchanged.
[validation]
feature = "ai/temper#1210"
plan = "ai/temper#1211"
source_branch = "agent/pr-for-feature-1210"
change = "updated"

[feature_contract]
claim = "Enabled mutation authority requires one retained root-coherent forest containing implementation, caller, and focused_test source evidence; incomplete, cross-root, irrelevant, malformed, denied, and failed activity receives no credit, and only one exact ordinary read after completion authorizes the matching mutation."
stimulus = "Run one live engineer repair with distinct routing and focused-test roots produced in one batch, an early route read, one immutable mixed recovery batch that admits the implementation source, one provider-derived active-root trace, later caller and separate focused-test source consumers, post-completion detours, a denied direct patch, and one post-source exact read."
observable = "Six successful V1-correlated and V1-lineaged graph results; two retained roots; four same-snapshot non-credit denials; implementation progress leaves four recovery slots; trace progress leaves caller and focused-test evidence; typed implementation/caller sources plus a separate focused-test source; three post-completion local denials; one policy-precondition mutation denial; one authoritative exact read; one matching one-file mutation; host validation; Actions success; merge; and source closure."
assertion = "Only the active-root implementation and trace, the later caller source, and the separate focused-test root source contribute evidence and complete the retained forest; broad, malformed, selectorless, cross-root, denied, failed, duplicate, and post-completion activity never reaches the provider, spends allowance, or contributes evidence; the early read and denied patch create no authority; exactly one later route read authorizes exactly one minimal patch."
runtime_budget_seconds = 600
jig_script_path = "jig/mapped-live-exact-source-selection.json"

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/repo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Require complete retained decision evidence before route mutation"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-repo-project"
lifecycle_profile = "mapped-live-exact-source-selection"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "get_architecture", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/mapped-live-exact-source-selection.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "the engineer recovers a complete retained root-coherent implementation/caller/focused-test forest, observes that all non-credit activity stays local, receives one direct-patch precondition denial, performs one post-source exact route read, applies the matching repair, passes host validation and Actions, merges the PR, and closes the source issue"

[expect]
outcome = "The mapped live run deterministically completes the retained decision-evidence forest, denies every non-credit detour and early authority path, and converges through one post-source exact read and one privacy-safe repair."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-exact-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.events]]
required = true
id = "early-route-read-has-no-retroactive-authority"
event = "tool.end"
fields.tool = "read"
fields.id = "early-route-read-before-complete-evidence"

[[expect.events]]
required = true
id = "cross-root-caller-is-noncredit"
event = "tool.error"
fields.tool = "codebase_memory_get_code_snippet"
fields.id = "recovery-cross-root-caller-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 4

[[expect.events]]
required = true
id = "irrelevant-broad-call-is-noncredit"
event = "tool.error"
fields.tool = "codebase_memory_search_graph"
fields.id = "recovery-irrelevant-broad-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test"
fields."tool.failure.graph.remaining_allowance" = 4

[[expect.events]]
required = true
id = "malformed-selector-is-noncredit"
event = "tool.error"
fields.tool = "codebase_memory_trace_path"
fields.id = "recovery-malformed-selector-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test"
fields."tool.failure.graph.remaining_allowance" = 4

[[expect.events]]
required = true
id = "implementation-progress-keeps-trace-caller-and-test-missing"
event = "tool.error"
fields.tool = "codebase_memory_get_code_snippet"
fields.id = "recovery-satisfied-implementation-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.missing_evidence" = "trace,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 4

[[expect.events]]
required = true
id = "active-root-implementation-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "implementation"

[[expect.events]]
required = true
id = "active-root-caller-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "caller"

[[expect.events]]
required = true
id = "separate-root-focused-test-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.complete" = true
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "focused_test"

[[expect.events]]
required = true
id = "direct-mutation-is-denied-before-post-source-read"
event = "tool.error"
fields.tool = "apply_patch"
fields.id = "patch-route-before-post-source-read"
fields.duration_ms = 0
fields."tool.failure.category" = "policy_denial"
fields."tool.failure.reason" = "policy_precondition"
fields."tool.failure.retry_disposition" = "satisfy_policy"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false

[[expect.events]]
required = true
id = "post-source-exact-route-read-completes"
event = "tool.end"
fields.tool = "read"
fields.id = "read-route-after-complete-source-evidence"

[[expect.sequence]]
required = true
id = "incomplete-forest-recovers-before-exact-selection-and-repair"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.lineage.stage" = "root" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.lineage.stage" = "root" } },
  { event = "tool.end", fields = { tool = "read", id = "early-route-read-before-complete-evidence" } },
  { event = "tool.error", fields = { id = "recovery-cross-root-caller-denied", "tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "implementation" } },
  { event = "tool.error", fields = { id = "recovery-satisfied-implementation-denied", "tool.failure.graph.missing_evidence" = "trace,caller,focused_test", "tool.failure.graph.remaining_allowance" = 4 } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "caller" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "tool.error", fields = { tool = "apply_patch", id = "patch-route-before-post-source-read", "tool.failure.reason" = "policy_precondition" } },
  { event = "tool.end", fields = { tool = "read", id = "read-route-after-complete-source-evidence" } },
  { event = "tool.end", fields = { tool = "apply_patch", id = "patch-route-after-complete-source-evidence" } },
  { event = "tool.end", fields = { tool = "bash", id = "validate-converged-repair" } },
  { event = "tool.end", fields = { tool = "submit_for_pr", id = "submit-converged-repair" } },
  { event = "workspace.diff.produced", fields = { changed_count = 1 } },
]

[[expect.count]]
required = true
id = "six-successful-complete-v1-graph-results"
event = "mcp.tool.result"
fields.is_error = false
fields."graph.correlation.complete" = true
