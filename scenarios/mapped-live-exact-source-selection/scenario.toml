schema = "temper.scenario.v1"
name = "mapped-live-exact-source-selection"
status = "active"
intent = "Validate feature #1151's requirement that only a successful exact ordinary read after complete typed graph source evidence authorizes the matching workspace mutation."
introduced_by = "#1144"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/mapped-live-focused-test-source-relevance"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#1151"
plan = "ai/temper#1152"
source_branch = "agent/pr-for-feature-1151"
change = "updated"

[feature_contract]
claim = "An exact route read performed before qualifying graph source evidence has no retroactive authority; a direct mutation remains local until one successful exact ordinary read follows complete typed evidence."
stimulus = "Run one live engineer repair with an early same-turn read batch containing the eventual route target; later consume typed implementation, caller, and focused-test sources plus bounded generic and forest evidence; attempt the exact patch before and after one post-source exact read."
observable = "Ten successful graph results with complete V1 correlation and lineage, three typed source kinds, the declared route target, one closed local policy denial with no workspace diff, one post-source exact read, one matching repair, host validation, Actions success, merge, and issue closure."
assertion = "The early exact read and denied mutation create no selection or mutation authority; only the later exact ordinary read authorizes the matching one-file patch, and retained evidence contains closed ordering, policy, typing, target, and gate facts."
runtime_budget_seconds = 600
jig_script_path = "jig/mapped-live-exact-source-selection.json"

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/repo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Require an exact post-source route read before mutation"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-repo-project"
lifecycle_profile = "mapped-live-exact-source-selection"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/mapped-live-exact-source-selection.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "the engineer performs an early route read, consumes typed implementation, caller, and focused-test sources with bounded generic and forest evidence, receives one local precondition denial for a direct patch, performs one post-source exact route read, applies the matching repair, passes host validation and Actions, merges the PR, and closes the source issue"

[expect]
outcome = "The mapped live run denies mutation after an early non-authoritative route read, admits the matching mutation only after one post-source exact read, and converges through one privacy-safe repair."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-exact-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.events]]
required = true
id = "implementation-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "implementation"

[[expect.events]]
required = true
id = "caller-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "caller"

[[expect.events]]
required = true
id = "focused-test-source-is-typed"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = false
fields."graph.lineage.complete" = true
fields."graph.lineage.stage" = "carry_forward"
fields."graph.lineage.decision_evidence_kind" = "focused_test"

[[expect.sequence]]
required = true
id = "complete-three-kind-chain-precedes-exact-selection"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false, "graph.lineage.complete" = true, "graph.lineage.stage" = "root" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "implementation" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "caller" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.focused_test_discovery" = "no_eligible_selector" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.lineage.focused_test_discovery" = "eligible_selector_returned" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "tool.end", fields = { tool = "read", id = "read-route-after-source-evidence" } },
]

[[expect.events]]
required = true
id = "mismatched-typed-confirmation-fails-closed"
event = "tool.error"
fields.tool = "codebase_memory_get_code_snippet"
fields.id = "selection-mismatched-confirmation-denied"
fields."tool.failure.category" = "graph_lifecycle_denial"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.graph.missing_evidence" = "focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"

[[expect.events]]
required = true
id = "early-route-read-completes-without-retroactive-authority"
event = "tool.end"
fields.tool = "read"
fields.id = "early-route-read-before-source"

[[expect.events]]
required = true
id = "direct-mutation-is-locally-denied-with-actionable-guidance"
event = "tool.error"
fields.tool = "apply_patch"
fields.id = "patch-route-before-post-source-read"
fields.duration_ms = 0
fields."tool.failure.category" = "policy_denial"
fields."tool.failure.reason" = "policy_precondition"
fields."tool.failure.retry_disposition" = "satisfy_policy"
fields."tool.failure.retryable" = false
fields."tool.failure.conventional_fallback" = false
fields."tool.failure.message" = "workspace mutation blocked: use the ordinary read tool to read the exact target named by this mutation after either its qualifying graph source result has completed or conventional fallback has been released, then retry the mutation"

[[expect.events]]
required = true
id = "post-source-exact-route-read-completes"
event = "tool.end"
fields.tool = "read"
fields.id = "read-route-after-source-evidence"

[[expect.sequence]]
required = true
id = "early-read-precedes-typed-evidence-and-cannot-authorize-mutation"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false, "graph.lineage.stage" = "root" } },
  { event = "tool.end", fields = { tool = "read", id = "early-route-read-before-source" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "implementation" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "tool.error", fields = { tool = "apply_patch", id = "patch-route-before-post-source-read", "tool.failure.category" = "policy_denial", "tool.failure.reason" = "policy_precondition" } },
  { event = "tool.end", fields = { tool = "read", id = "read-route-after-source-evidence" } },
]

[[expect.sequence]]
required = true
id = "typed-sources-denial-exact-read-and-matching-repair"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false, "graph.lineage.stage" = "root" } },
  { event = "tool.start", fields = { tool = "read", id = "early-route-read-before-source" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "implementation" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "caller" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.lineage.focused_test_discovery" = "no_eligible_selector" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.lineage.focused_test_discovery" = "eligible_selector_returned" } },
  { event = "tool.error", fields = { id = "selection-mismatched-confirmation-denied", "tool.failure.graph.missing_evidence" = "focused_test" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.lineage.decision_evidence_kind" = "focused_test" } },
  { event = "tool.start", fields = { tool = "apply_patch", id = "patch-route-before-post-source-read", "tool.arguments.present" = false } },
  { event = "tool.error", fields = { tool = "apply_patch", id = "patch-route-before-post-source-read", "tool.failure.reason" = "policy_precondition" } },
  { event = "tool.end", fields = { tool = "read", id = "read-route-after-source-evidence" } },
  { event = "tool.end", fields = { tool = "apply_patch", id = "patch-route-after-post-source-read" } },
  { event = "tool.end", fields = { tool = "bash", id = "validate-post-source-read-repair" } },
  { event = "tool.end", fields = { tool = "submit_for_pr", id = "submit-post-source-read-repair" } },
  { event = "workspace.diff.produced", fields = { changed_count = 1 } },
]

[[expect.count]]
required = true
id = "ten-successful-complete-v1-graph-results"
event = "mcp.tool.result"
fields.is_error = false
fields."graph.correlation.complete" = true
fields."graph.correlation.version" = 1
fields."graph.lineage.complete" = true
fields."graph.lineage.version" = 1
exactly = 10

[[expect.count]]
required = true
id = "four-code-searches-with-three-competing-generic-results"
event = "mcp.tool.called"
fields."mcp.tool" = "search_code"
exactly = 4

[[expect.count]]
required = true
id = "two-traces-including-selection-competing-forest-traversal"
event = "mcp.tool.called"
fields."mcp.tool" = "trace_path"
exactly = 2

[[expect.count]]
required = true
id = "one-focused-test-semantic-fallback"
event = "mcp.tool.called"
fields."mcp.tool" = "search_graph"
exactly = 1

[[expect.count]]
required = true
id = "three-typed-source-consumers"
event = "mcp.tool.called"
fields."mcp.tool" = "get_code_snippet"
exactly = 3

[[expect.count]]
required = true
id = "no-provider-or-protocol-detours"
event = "mcp.tool.result"
fields.is_error = true
exactly = 0

[[expect.count]]
required = true
id = "one-local-precondition-denial-without-execution"
event = "tool.error"
fields.tool = "apply_patch"
fields."tool.failure.category" = "policy_denial"
fields."tool.failure.reason" = "policy_precondition"
exactly = 1

[[expect.count]]
required = true
id = "one-early-exact-route-read-without-authority"
event = "tool.end"
fields.tool = "read"
fields.id = "early-route-read-before-source"
exactly = 1

[[expect.count]]
required = true
id = "one-authoritative-post-source-exact-route-read"
event = "tool.end"
fields.tool = "read"
fields.id = "read-route-after-source-evidence"
exactly = 1

[[expect.count]]
required = true
id = "one-minimal-mutation"
event = "tool.end"
fields.tool = "apply_patch"
exactly = 1

[[expect.count]]
required = true
id = "one-workspace-diff-only-after-successful-mutation"
event = "workspace.diff.produced"
exactly = 1

[[expect.count]]
required = true
id = "one-host-submission"
event = "tool.end"
fields.tool = "submit_for_pr"
exactly = 1

[expect.effective_configuration]
id = "rapid-exact-source-selection-harness-cadence"
ci_poll_cadence_secs = 1
poll_cadence_secs = 1
mechanical_cadence_secs = 1

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/repo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "feature #1151/#1152; one early same-turn read set containing the declared route target; typed implementation/caller/focused_test sources; three generic competitors and one forest traversal; one closed mutation precondition denial; one post-source exact route read; privacy-safe closed facts; matching repair and host gates"
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Tighten early-read non-retroactivity, post-source exact-read admission, typed-lineage, privacy, count, or convergence assertions.",
  "Update generic privacy-safe observability without retaining selectors, roots, source, provider payloads, mutation arguments, or traces.",
]
requires_new_scenario_or_major_update = [
  "Allowing a pre-source, same-batch, wrong-target, failed, malformed, or ambiguous read to authorize mutation.",
  "Allowing a denied or unmatched mutation to execute, create a workspace diff, or gain selection authority.",
  "Retaining raw prompts, selectors, roots, source, provider output, credentials, arguments, host-gate output, or diagnostic traces.",
  "Replacing the mandatory live Forgejo/Actions/standalone-Temper/Jig topology with a lower-level test.",
]
