id = "four-failed-noncredit-recovery-attempts-share-snapshot"
event = "tool.error"
fields."tool.failure.reason" = "decision_evidence_incomplete"
fields."tool.failure.graph.missing_evidence" = "trace,implementation,caller,focused_test"
fields."tool.failure.graph.permitted_action" = "targeted_current_root_graph_call"
fields."tool.failure.graph.remaining_allowance" = 4
exactly = 4

[[expect.count]]
required = true
id = "one-satisfied-implementation-local-denial-after-progress"
event = "tool.error"
