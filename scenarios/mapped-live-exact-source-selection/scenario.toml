[expect.effective_configuration]
id = "rapid-decision-evidence-convergence-cadence"
ci_poll_cadence_secs = 1
poll_cadence_secs = 1
mechanical_cadence_secs = 1

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "get_architecture", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_get_architecture", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/repo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "feature #1210/#1211; two immutable routing and focused-test roots; early exact read without authority; mixed active implementation plus cross-root, broad, malformed, duplicate, denied, and failed non-credit attempts; one provider-derived active-root trace; later provider-derived caller and separate-root focused_test source completion; local duplicate and post-completion detours; one direct patch denial; one post-source exact read; one matching mutation; privacy-safe typed ordering and closed policy facts"
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Tighten root-coherent recovery, non-credit denial, typed-source, exact-read ordering, privacy, count, or convergence assertions.",
  "Update generic privacy-safe observability without retaining selectors, roots, source, provider payloads, mutation arguments, or traces.",
]
requires_new_scenario_or_major_update = [
  "Allowing incomplete, cross-root, irrelevant, malformed, denied, failed, or selectorless activity to create evidence, selection, fallback, or mutation authority.",
  "Allowing a pre-source, same-batch, wrong-target, failed, malformed, or ambiguous read to authorize mutation.",
  "Retaining raw prompts, selectors, roots, source, provider output, credentials, arguments, host-gate output, local paths, or diagnostic traces.",
  "Replacing the mandatory live Forgejo/Actions/standalone-Temper/Jig topology with a lower-level test.",
]
