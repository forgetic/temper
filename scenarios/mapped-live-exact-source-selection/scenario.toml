schema = "temper.scenario.v1"
name = "mapped-live-exact-source-selection"
status = "active"
intent = "Validate feature #1263's reachable post-convergence correction from provisional model authority to one exact route read and matching minimal mutation."
introduced_by = "#1144"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/mapped-live-focused-test-source-relevance"

[runner]
uses = "manifest"

# Historical mapping audit: feature ai/temper#1210, plan ai/temper#1211, and
# source branch agent/pr-for-feature-1210; before that, feature ai/temper#1151,
# plan ai/temper#1152, and source branch agent/pr-for-feature-1151. The
# introduced_by provenance is unchanged.
[validation]
feature = "ai/temper#1263"
plan = "ai/temper#1264"
source_branch = "agent/pr-for-feature-1263"
change = "new"

[feature_contract]
claim = "After a complete retained two-root forest closes graph exploration, bounded inspection and a later explicit correction replace provisional src/model.rs authority with provider-supported src/route.rs::worker_slot authority; only a still-later exact ordinary route read authorizes one matching mutation."
stimulus = "Run repetition 001's live engineer repair with distinct implementation/caller and focused-test roots, preview and commit provisional model authority, consume the model trace plus caller and focused-test sources, close graph exploration, deny a premature provisional read, inspect every presented correction candidate in one bounded checkpoint, choose the route in a later turn, challenge retired state, then read and repair repo/src/route.rs."
observable = "Ten successful V1-correlated and V1-lineaged graph results plus one controlled unavailable-source rejection; two retained roots; four same-snapshot local initial denials; provisional model implementation evidence; one correction-supporting trace; complete caller/focused-test evidence; graph closure; one correction-inspection read denial; two bounded previews; one later corrected implementation result; stale correction and old-target denials; one authoritative route read; one matching one-file mutation; host validation; Actions success; merge; and source closure."
assertion = "Sibling-root, broad, malformed, unrelated, old, and stale activity never reaches the provider or gains authority; one unpresented unavailable exact source is rejected by the provider and gains no authority; graph closure survives correction inspection; successful correction atomically retires provisional model authority and its handoff; exactly one later repo/src/route.rs read authorizes exactly one byte-matching route patch; retained evidence exposes only closed typed and aggregate facts."
runtime_budget_seconds = 600
jig_script_path = "jig/mapped-live-exact-source-selection.json"

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/repo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Correct provisional model authority before route mutation"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-repo-project"
lifecycle_profile = "mapped-live-exact-source-selection"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "get_architecture", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/mapped-live-exact-source-selection.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "the engineer converges a two-root forest, closes graph exploration, inspects every bounded correction candidate, later corrects provisional model authority to worker_slot, proves old and stale authority remains denied, performs one exact route read, applies one route repair, passes host validation and Actions, merges the PR, and closes the source issue"

[expect]
outcome = "The mapped live repetition 001 path deterministically replaces provisional model authority after graph closure and reaches exactly one privacy-safe route mutation through one later exact read."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-exact-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.events]]
required = true
