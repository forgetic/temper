schema = "temper.scenario.v1"
name = "worker-codex-benchmark"
status = "active"
intent = "Validate benchmark accounting and MCP proxy contracts against the feature checkout while a Jig report lands through real host CI; no model timing claim is made."
introduced_by = "#1285"
owner_area = "delivery-validation"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/basic-delivery"

[validation]
feature = "ai/temper#1285"
plan = "ai/temper#1285"
source_branch = "agent/pr-for-feature-1285"
change = "new"

[feature_contract]
claim = "The shared worker-versus-Codex harness retains failures, rejects incomplete comparisons, captures MCP transport faithfully, and separates scripted delivery evidence from real-model performance."
stimulus = "A Jig engineer creates a bounded contract report and submits it through real Forgejo host CI; a required host assertion runs the exact benchmark accounting, proxy, and campaign tests from the feature checkout."
observable = "One accepted report, passing real CI, one merged PR, closed source issue, exact source identities, and successful deterministic accounting/proxy/campaign tests with no native timing evidence."
assertion = "The required host assertion binds the checked-in test sources to the validation checkout head and emits only closed pass/fail checkpoints; synthetic evidence never claims a performance target."
runtime_budget_seconds = 600
jig_script_path = "jig/worker-codex-benchmark.json"

[runner]
uses = "manifest"

[observability]
log_format = "json"
rust_log = "temper=debug"

[topology]
kind = "single-repo-forgejo-standalone"
forge = "forgejo"
runner = "forgejo-actions-host"
temper = "standalone"
agent_model = "scripted-fake-llm"
repos = ["service"]

[workflow]
name = "basic-delivery"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/service"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "intake"
repo = "service"
kind = "intake"
title = "Deliver the worker-versus-Codex benchmark contract report"
body = "config/intake-issue.md"
author = "site_admin"
labels = []
created_after = "standalone_ready"

[[agents]]
role = "architect"
kind = "llm"
mode = "scripted-fake"
tool = "triage_workspace"
queues = ["triage"]
expected_verdict = "ready_code"

[[agents]]
role = "engineer"
kind = "llm"
mode = "scripted-fake"
tool = "coding_workspace"
queues = ["code_ready", "pr_ci_failed"]

[[agents]]
role = "mechanical"
kind = "built-in"
mode = "automation"
queues = ["raw_intake", "landing"]

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the service repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
roles = ["architect", "engineer"]
script_path = "jig/worker-codex-benchmark.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-service-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-intake-issue"
action = "issue.seed"
issue_id = "intake"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "single-pull-request"
until = "single implementation PR merged and source issue closed"

[expect]
template = "single-pr-merged-source-closed"
outcome = "A report explicitly marked as scripted delivery evidence passes host CI and lands; exact-checkout deterministic tests independently validate benchmark accounting and MCP recording."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "intake-triaged-and-finalized"
artifact = "issue:intake"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-updated"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "triage-transition-observed"
event = "transition.applied"
artifact_ref = "$source_artifact"
transition = "triage_intake_to_code"

[[expect.events]]
required = true
id = "implementation-pr-opened-event"
event = "pr.opened"
source_artifact = "$source_artifact"
kind = "implementation_pr"
for_issue_number = "$provider.issue_number"

[[expect.sequence]]
required = true
id = "basic-delivery-converges-by-events"
scope = "source_artifact"
events = [
  { event = "transition.applied", artifact_ref = "$source_artifact", transition = "triage_intake_to_code" },
  { event = "pr.opened", source_artifact = "$source_artifact" },
  { event = "ci.completed", pr_ref = "$implementation_pr", conclusion = "success" },
  { event = "pr.merged", pr_ref = "$implementation_pr" },
  { event = "item.resolved", artifact_ref = "$source_artifact" },
]

[[expect.count]]
required = true
id = "no-duplicate-implementation-prs-by-source"
event = "pr.opened"
group_by = ["source_artifact"]
max = 1

[change_policy]
validation_report_required = true
promotion_artifact = "optional"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Clarify README text without changing seeded behavior.",
  "Update copied fixtures when the basic-delivery workflow changes incompatibly and the scenario remains the promoted regression.",
  "Add expectation details that narrow the documented happy path without requiring a new runner.",
]
requires_new_scenario_or_major_update = [
  "Adding a human review or owner gate.",
  "Changing the topology away from one Forgejo repo served by standalone Temper.",
  "Replacing the scripted fake agents with a live-provider validation requirement.",
]

[[expect.sequence]]
required = true
id = "report-read-write-validation-and-submission"
events = [
  { event = "tool.end", fields = { tool = "read", id = "benchmark-read-contract" } },
  { event = "tool.end", fields = { tool = "write", id = "benchmark-write-report" } },
  { event = "tool.end", fields = { tool = "bash", id = "benchmark-validate-report" } },
  { event = "tool.end", fields = { tool = "submit_for_pr", id = "benchmark-submit-report" } },
  { event = "workspace.diff.produced", fields = { changed_count = 1 } },
]

[[expect.count]]
required = true
id = "one-report-mutation"
event = "tool.end"
fields.tool = "write"
exactly = 1

[[assertions]]
id = "exact-checkout-harness-contracts-and-live-delivery"
kind = "command"
phase = "after-convergence"
command = "assertions/verify-harness.sh"
timeout_ms = 60000
required = true

[live_harness]
poll_cadence = "1s"
ci_poll_cadence = "1s"
mechanical_cadence = "1s"
poll_backstop = "10m"
