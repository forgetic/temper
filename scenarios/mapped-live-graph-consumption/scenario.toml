schema = "temper.scenario.v1"
name = "mapped-live-graph-consumption"
status = "active"
intent = "Validate feature #1009's approved multi-part provider transcript as later-turn current-root decision evidence before one minimal live repair."
introduced_by = "#1014"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#1009"
plan = "ai/temper#1010"
source_branch = "agent/pr-for-feature-1009"
change = "new"

[feature_contract]
claim = "Successful targeted results from the approved multi-part transcript retain one typed current-root lineage across later transformed refinement, trace, and source calls; denied and unavailable paths do not manufacture authority."
stimulus = "Run one engineer repair through real Forgejo, a host Actions runner, standalone Temper, and a Jig-driven provider whose text and structured result parts expose nested symbols, caller lists, related source references, and source metadata."
observable = "Ordered complete V1 correlation and lineage-stage facts, current-root binding, privacy-safe producer/carry/source/unavailable checkpoint counts, bounded conventional fallback, the minimal repair, host validation, CI success, and workflow convergence."
assertion = "The five successful targeted graph calls form a later-turn root/carry chain through both current-root source reads; one expected unavailable descendant then releases conventional fallback with no immediate graph retry before the minimal repair; focused denial regressions remain covered; and aggregate evidence contains no provider value, target, source, path, digest, prompt, credential, or trace."
runtime_budget_seconds = 600
jig_script_path = "jig/mapped-live-graph-consumption.json"

[observability]
log_format = "json"
rust_log = "temper=debug"

[live_harness]
ci_poll_cadence = "1s"
poll_cadence = "1s"
mechanical_cadence = "1s"

[topology]
kind = "single-repo-forgejo-standalone"
forge = "forgejo"
runner = "forgejo-actions-host"
temper = "standalone"
agent_model = "scripted-fake-llm"
repos = ["service"]

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Consume the approved multi-part graph transcript before repair"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[agents]]
role = "engineer"
kind = "llm"
mode = "scripted-fake"
tool = "coding_workspace"
queues = ["code_ready"]

[[agents]]
role = "mechanical"
kind = "built-in"
mode = "automation"
queues = ["landing"]

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-demo-project"
lifecycle_profile = "mapped-live-graph-consumption"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/mapped-live-graph-consumption.json"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "engineer consumes the approved later-turn multi-part lineage and both current-root sources, observes one expected unavailable descendant, falls back without an immediate graph retry, performs the minimal repair, passes host validation and CI, and closes the source issue"

[expect]
outcome = "The live agent consumes the approved five-call current-root lineage, handles one expected unavailable descendant through conventional fallback without an immediate graph retry, writes only the minimal repair, and converges through real Actions CI while focused regressions retain denial coverage."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.sequence]]
required = true
id = "mapped-multi-part-lineage-before-minimal-repair"
scope = "source_artifact"
events = [
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.lineage.complete" = true, "graph.lineage.stage" = "root" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.lineage.complete" = true, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.lineage.complete" = true, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.lineage.complete" = true, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.lineage.complete" = true, "graph.lineage.stage" = "carry_forward" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = true } },
  { event = "tool.start", fields = { tool = "read", id = "read-conventional-fallback-source" } },
  { event = "workspace.diff.produced" },
]

[[expect.count]]
required = true
id = "five-complete-v1-correlations-and-lineages"
event = "mcp.tool.result"
fields."graph.correlation.complete" = true
fields."graph.correlation.version" = 1
fields."graph.lineage.complete" = true
fields."graph.lineage.version" = 1
exactly = 5

[[expect.count]]
required = true
id = "one-root-result"
event = "mcp.tool.result"
fields."graph.lineage.stage" = "root"
exactly = 1

[[expect.count]]
required = true
id = "four-later-turn-descendants"
event = "mcp.tool.result"
fields."graph.lineage.stage" = "carry_forward"
exactly = 4

[[expect.count]]
required = true
id = "one-targeted-search"
event = "mcp.tool.called"
fields."mcp.tool" = "search_graph"
exactly = 1

[[expect.count]]
required = true
id = "one-dependent-refinement"
event = "mcp.tool.called"
fields."mcp.tool" = "search_code"
exactly = 1

[[expect.count]]
required = true
id = "one-dependent-trace"
event = "mcp.tool.called"
fields."mcp.tool" = "trace_path"
exactly = 1

[[expect.count]]
required = true
id = "three-source-requests-with-one-unavailable-descendant"
event = "mcp.tool.called"
fields."mcp.tool" = "get_code_snippet"
exactly = 3

[[expect.count]]
required = true
id = "one-expected-unavailable-descendant"
event = "mcp.tool.result"
fields."mcp.tool" = "get_code_snippet"
fields.is_error = true
exactly = 1

[[expect.count]]
required = true
id = "one-conventional-fallback-read"
event = "tool.start"
fields.tool = "read"
fields.id = "read-conventional-fallback-source"
exactly = 1

[[expect.count]]
required = true
id = "no-broad-architecture-call"
event = "mcp.tool.called"
fields."mcp.tool" = "get_architecture"
exactly = 0

[expect.effective_configuration]
id = "rapid-mapped-lineage-harness-cadence"
ci_poll_cadence_secs = 1
poll_cadence_secs = 1
mechanical_cadence_secs = 1

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/demo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "approved nested results, short symbol, caller list, related-source, and source-metadata parts; one root plus four later-turn carry-forwards; two current-root sources; one expected unavailable descendant and conventional fallback without immediate graph retry; focused denial regressions; privacy-safe aggregate checkpoints only"
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Clarify the approved multi-part transcript without exposing provider or model values.",
  "Add privacy-safe aggregate lineage, denial, fallback, host-validation, or CI-convergence evidence.",
]
requires_new_scenario_or_major_update = [
  "Treating ambiguous, truncated, failed, unavailable, unrelated, cross-root, or producer-turn results as graph decision authority.",
  "Replacing the mandatory live Forgejo/Actions/standalone-Temper/Jig topology with a lower-level test.",
]
