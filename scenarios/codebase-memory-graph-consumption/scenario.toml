schema = "temper.scenario.v1"
name = "codebase-memory-graph-consumption"
status = "active"
intent = "Validate privacy-safe typed graph correlation across bounded, ordered graph-to-graph refinement and current-root source consumption through the live codebase-memory topology."
introduced_by = "#962"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[runner]
uses = "manifest"

[validation]
feature = "ai/temper#962"
plan = "ai/temper#963"
source_branch = "agent/pr-for-feature-962"
change = "updated"

[feature_contract]
claim = "Only successful declared targeted graph refinement and confirmed current-root source reads with complete typed correlation count as graph-consumption evidence; generic, broad, extra, or unconsumed calls do not gain relevance."
stimulus = "Run one engineer repair through real Forgejo, Actions, standalone Temper, and a deterministic provider that rebinds a fresh stable key to the active checkout, then performs one provider-shaped exact five-call graph chain before the repair."
observable = "Privacy-safe tool names, aggregate call inventory, normalized current-root confirmation facts, ordered same-artifact MCP events, typed-correlation completion/version/tool/kind facts, repaired Rust file, host validation, and CI convergence."
assertion = "Exactly search_graph, search_code, trace_path, and two get_code_snippet calls occur in declared order under the confirmed current-root provider identity; each successful call has one complete V1 typed correlation of the declared kind; no broad, extra, failed, or unconsumed MCP call is retained; both sources are consumed before mutation; and the repair converges."
runtime_budget_seconds = 600
jig_script_path = "jig/codebase-memory-graph-consumption.json"

[observability]
log_format = "json"
rust_log = "temper=debug"

[topology]
kind = "single-repo-forgejo-standalone"
forge = "forgejo"
runner = "forgejo-actions-host"
temper = "standalone"
agent_model = "scripted-fake-llm"
repos = ["service"]

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Validate bounded graph-consumption evidence"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[agents]]
role = "engineer"
kind = "llm"
mode = "scripted-fake"
tool = "coding_workspace"
queues = ["code_ready"]
expected_output = "memory_guided_file"

[[agents]]
role = "mechanical"
kind = "built-in"
mode = "automation"
queues = ["landing"]

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-demo-project"
lifecycle_profile = "graph-consumption"
advertises_safe_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]
readiness_delay_ms = 750

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "background"
tool_timeout_secs = 2
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/codebase-memory-graph-consumption.json"
first_tool = "codebase_memory_search_graph"
expected_result = "FAKE_MCP_GRAPH_RESULT"
expected_output_name = "src/lib.rs"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "engineer performs the declared five-call graph-consumption chain, repairs src/lib.rs, CI passes, and the source issue closes"

[expect]
outcome = "The engineer receives only declared safe codebase-memory tools, confirms the normalized active-root binding, performs the ordered five-call graph refinement/source chain, mutates src/lib.rs only after both source reads, validates the exact repair, and converges through real CI."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "graph-search-exposed"
event = "agent.tool.exposed"
fields."tool.name" = "codebase_memory_search_graph"
fields."mcp.tool" = "search_graph"
fields."tool.model_visible" = true

[[expect.events]]
required = true
id = "code-refinement-exposed"
event = "agent.tool.exposed"
fields."tool.name" = "codebase_memory_search_code"
fields."mcp.tool" = "search_code"
fields."tool.model_visible" = true

[[expect.events]]
required = true
id = "graph-trace-exposed"
event = "agent.tool.exposed"
fields."tool.name" = "codebase_memory_trace_path"
fields."mcp.tool" = "trace_path"
fields."tool.model_visible" = true

[[expect.events]]
required = true
id = "safe-source-tool-exposed"
event = "agent.tool.exposed"
fields."tool.name" = "codebase_memory_get_code_snippet"
fields."mcp.tool" = "get_code_snippet"
fields."tool.model_visible" = true

[[expect.events]]
required = true
id = "current-root-rebind-completed"
event = "codebase_memory.index.lifecycle"
fields."index.mode" = "background"
fields."index.outcome" = "completed"

[[expect.sequence]]
required = true
id = "ordered-provider-shaped-typed-graph-consumption"
scope = "source_artifact"
events = [
  { event = "mcp.tool.called", fields = { "mcp.tool" = "search_graph" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_graph", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.correlation.tool" = "codebase_memory_search_graph", "graph.correlation.target_kind" = "graph_query" } },
  { event = "mcp.tool.called", fields = { "mcp.tool" = "search_code" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.correlation.tool" = "codebase_memory_search_code", "graph.correlation.target_kind" = "pattern" } },
  { event = "mcp.tool.called", fields = { "mcp.tool" = "trace_path" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "trace_path", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.correlation.tool" = "codebase_memory_trace_path", "graph.correlation.target_kind" = "function_name" } },
  { event = "mcp.tool.called", fields = { "mcp.tool" = "get_code_snippet" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.correlation.tool" = "codebase_memory_get_code_snippet", "graph.correlation.target_kind" = "qualified_name" } },
  { event = "mcp.tool.called", fields = { "mcp.tool" = "get_code_snippet" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "get_code_snippet", is_error = false, "graph.correlation.complete" = true, "graph.correlation.version" = 1, "graph.correlation.tool" = "codebase_memory_get_code_snippet", "graph.correlation.target_kind" = "qualified_name" } },
  { event = "workspace.diff.produced", fields = { "file.path" = "src/lib.rs" } },
]

[[expect.count]]
required = true
id = "five-complete-v1-typed-correlations"
event = "mcp.tool.result"
fields."graph.correlation.complete" = true
fields."graph.correlation.version" = 1
exactly = 5

[[expect.count]]
required = true
id = "one-targeted-graph-search"
event = "mcp.tool.called"
fields."mcp.tool" = "search_graph"
exactly = 1

[[expect.count]]
required = true
id = "one-targeted-code-refinement"
event = "mcp.tool.called"
fields."mcp.tool" = "search_code"
exactly = 1

[[expect.count]]
required = true
id = "one-targeted-graph-trace"
event = "mcp.tool.called"
fields."mcp.tool" = "trace_path"
exactly = 1

[[expect.count]]
required = true
id = "two-confirmed-current-root-source-reads"
event = "mcp.tool.called"
fields."mcp.tool" = "get_code_snippet"
exactly = 2

[[expect.count]]
required = true
id = "no-broad-architecture-call"
event = "mcp.tool.called"
fields."mcp.tool" = "get_architecture"
exactly = 0

[codebase_memory]
mode = "required"
index = "background"
readiness_delay_ms = 750
fake_mcp_tools = ["search_graph", "search_code", "trace_path", "get_code_snippet", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_graph", "codebase_memory_search_code", "codebase_memory_trace_path", "codebase_memory_get_code_snippet", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/demo"
actual_project = "normalized-temper-v1-<stable-provider-key>"
graph_consumption_profile = "provider-shaped five-call chain; complete V1 typed graph/code/trace/source correlation; exact current-root consumption; no broad, generic, or unconsumed calls"
global_inventory_forbidden = true

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Clarify the provider-shaped five-call graph-consumption assertion without expanding its declared tool set.",
  "Add privacy-safe aggregate observability that preserves current-root ordering and complete typed-correlation evidence without raw targets or provider results.",
]
requires_new_scenario_or_major_update = [
  "Treating broad, generic, extra, cross-scope, out-of-order, incomplete, or unconsumed graph calls as relevant.",
  "Replacing the mandatory live Forgejo/Actions/Temper/Jig stack with a lower-level topology.",
]
