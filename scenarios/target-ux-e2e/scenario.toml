schema = "temper.scenario.v1"
name = "target-ux-e2e"
status = "active"
intent = "Prove the complete target-era operator lifecycle across init, check, plan, deployment-wide apply confirmation, serve startup, worker pools/profiles, workflow formats, docs/systemd, and webhook selection without cloning focused runtime suites."
introduced_by = "#192"
owner_area = "deployment-ux"
stability = "provisional"
timeout = "10m"

[fixtures]
extends = "scenarios/basic-delivery"

[runner]
uses = "manifest"

[target_ux]
contracts = [
  "top-level and subcommand help promote init -> check -> plan -> apply -> serve while compatibility/internal commands remain dispatchable but unpromoted",
  "init writes a local standalone bundle from a JSON workflow and check reports pre-apply token gaps",
  "checked-in JSON and YAML bundles pass equivalent static validation through check, plan, apply, and the serve-startup loading seam",
  "config-relative paths and explicit/systemd secret precedence are deterministic and human/JSON output stays redacted",
  "plan and apply carry every configured repository; confirmation decline performs no provisioning and --yes sends one deployment-wide request",
  "generated standalone and distributed pool/profile configuration reaches existing runtime adaptation seams",
  "engine and standalone expose POST /forgejo/webhook, polling remains the correctness backstop, serve trigger is rejected, and the legacy adapter remains dispatchable",
  "operator documentation, systemd examples, and the audit matrix describe the same public and compatibility contracts",
]
files = [
  "README.md",
  "scenario.toml",
  "config/standalone-json/config.toml",
  "config/standalone-json/credentials.toml",
  "config/standalone-json/workflow.json",
  "config/standalone-json/webhook-secret",
  "config/distributed-yaml/config.toml",
  "config/distributed-yaml/credentials.toml",
  "config/distributed-yaml/workflow.yaml",
  "config/distributed-yaml/webhook-secret",
  "config/trigger/forgejo-issue-webhook.json",
  "config/trigger/webhook-secret",
]
test_modules = [
  "support",
  "onboarding",
  "deployment",
  "runtime",
  "webhook",
  "compatibility",
]
external_contract_artifacts = [
  "tests/target_ux_e2e.rs and tests/target_ux/*.rs",
  "docs/reference/target-era-operator-contract-matrix.md",
  "docs/how-to/deploy-with-systemd.md",
  "examples/systemd config, credentials, workflow, engine unit, and worker unit",
]

[target_ux.shapes.standalone]
config_path = "config/standalone-json/config.toml"
credentials_path = "config/standalone-json/credentials.toml"
workflow_path = "config/standalone-json/workflow.json"
expected_topology = "standalone"
serve_contract = "temper serve standalone accepts --id; worker-only flags are rejected before startup"

[target_ux.shapes.distributed]
config_path = "config/distributed-yaml/config.toml"
credentials_path = "config/distributed-yaml/credentials.toml"
workflow_path = "config/distributed-yaml/workflow.yaml"
expected_topology = "distributed"
serve_contract = "temper serve worker requires --pool when pools are configured and enforces pool capacity/profile adaptation"

[target_ux.plan_apply]
plan_contract = "read-only report contains every configured repository in human and JSON output"
confirmation_contract = "decline makes no provisioning call or credential mutation; --yes sends one deployment-wide request"
compatibility_projection = "single-repository JSON retains historical singular fields"

[target_ux.documentation]
operator_guide = "docs/how-to/deploy-with-systemd.md"
systemd_examples = "examples/systemd"
audit_matrix = "docs/reference/target-era-operator-contract-matrix.md"

[target_ux.trigger]
payload_path = "config/trigger/forgejo-issue-webhook.json"
webhook_secret_path = "config/trigger/webhook-secret"
selected_surfaces = ["temper serve engine", "temper serve standalone"]
endpoint = "POST /forgejo/webhook"
legacy_internal_adapter_command = "temper trigger-forgejo"
rejected_command = "temper serve trigger"

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
fixture_paths_must_exist = true
compatible_changes = [
  "Clarify target UX documentation without weakening the covered command contracts.",
  "Update fake fixture tokens or local URLs when parser wording changes.",
]
requires_new_scenario_or_major_update = [
  "Replacing the engine/standalone POST /forgejo/webhook trigger contract.",
  "Removing standalone or distributed target-era validation coverage.",
  "Removing multi-repository plan/apply or confirmation coverage.",
  "Removing worker-pool auth, profile, or capacity coverage.",
]
