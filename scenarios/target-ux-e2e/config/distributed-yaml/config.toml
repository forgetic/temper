schema_version = 1

[deployment]
name = "target-ux-distributed"
topology = "distributed"

[workflow]
file = "workflow.yaml"

[paths]
state_dir = "state"
workspace_dir = "workspace"

[forge]
type = "forgejo"
url = "http://forge.example.invalid"
admin = "root"

[engine]
bind = "127.0.0.1:48200"
repos = ["acme/service"]
roles = ["engineer", "reviewer"]
forge_token = "engine-forge-token"
webhook_secret = "webhook-secret"
webhook_secret_file = "webhook-secret"

[worker]
daemon_url = "http://127.0.0.1:48200"
git_base_url = "https://git.example.invalid"
max_concurrent_jobs = 4

[[worker.pools]]
name = "engineers"
roles = ["engineer"]
repos = ["acme/service"]
max_concurrent_jobs = 2
agent_profile = "coding"
worker_token = "worker-engineers-token"

[[worker.pools]]
name = "reviewers"
roles = ["reviewer"]
repos = ["acme/service"]
max_concurrent_jobs = 1
agent_profile = "review"
worker_token = "worker-reviewers-token"

[agent]
provider = "deepseek"
max_iterations = 150

[agent.profiles.coding]
command = ["temper", "agent"]
provider = "deepseek"
model = "deepseek-chat"
provider_url = "https://provider.example.invalid/v1"
max_iterations = 150
subagents = true
credential = "coding-provider-token"

[agent.profiles.review]
command = ["temper", "agent"]
provider = "anthropic"
model = "claude-opus-4-8"
investigate_model = "claude-haiku-4-5"
provider_url = "https://provider.example.invalid/v1"
max_iterations = 80
subagents = false
credential = "review-provider-token"
