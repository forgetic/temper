schema = "temper.scenario.v1"
name = "codebase-memory-agent"
status = "active"
intent = "Validate the codebase-memory MCP tool path through the live manifest runner and real Temper agent/tool configuration."
introduced_by = "#82"
owner_area = "agent-tools"
stability = "provisional"
timeout = "10m"

[runner]
uses = "manifest"

[observability]
log_format = "json"
rust_log = "temper=debug"

[topology]
kind = "single-repo-forgejo-standalone"
forge = "forgejo"
runner = "forgejo-actions-host"
temper = "standalone"
agent_model = "scripted-fake-llm"
repos = ["service"]

[workflow]
name = "codebase-memory-agent"
format = "temper-workflow-json"
path = "config/workflow.json"

[[repos]]
id = "service"
slug = "acme/demo"
default_branch = "main"
seed_path = "repo"
ci_source = "config/ci.yml"
ci_seed_path = "repo/.forgejo/workflows/ci.yml"
ci_target = ".forgejo/workflows/ci.yml"

[[issues]]
id = "source"
repo = "service"
kind = "code"
title = "Validate codebase-memory agent tool path"
body = "config/source-issue.md"
author = "site_admin"
labels = ["code", "ready"]
created_after = "standalone_ready"

[[agents]]
role = "engineer"
kind = "llm"
mode = "scripted-fake"
tool = "coding_workspace"
queues = ["code_ready"]
expected_output = "memory_guided_file"

[[agents]]
role = "mechanical"
kind = "built-in"
mode = "automation"
queues = ["landing"]

[[steps]]
id = "provision-forgejo"
action = "forgejo.provision"
description = "Start the real Forgejo validation instance and create the demo repository."

[[steps]]
id = "wait-for-forgejo-runner"
action = "forgejo_runner.ready"
description = "Register and require the real host forgejo-runner / Actions CI worker."

[[steps]]
id = "start-fake-codebase-memory-mcp"
action = "mcp.fake_codebase_memory.start"
project = "actual-demo-project"
advertises_safe_tools = ["search_code", "list_projects", "index_status"]
advertises_hidden_tools = ["index_repository", "delete_project"]

[[steps]]
id = "configure-codebase-memory-tools"
action = "agent.tools.configure"
role = "engineer"
tool = "codebase_memory"
mode = "required"
index = "blocking"
server = "$step:start-fake-codebase-memory-mcp"

[[steps]]
id = "configure-jig-fake-llm"
action = "jig.fake_llm"
role = "engineer"
script_path = "jig/codebase-memory-agent.json"
first_tool = "codebase_memory_search_code"
expected_result = "FAKE_MCP_SEARCH_RESULT"
expected_output_name = "MEMORY_NOTES.md"

[[steps]]
id = "launch-standalone-temper"
action = "temper.launch_standalone"
config = "config/workflow.json"
requires_observability = true

[[steps]]
id = "seed-demo-repo"
action = "repo.seed"
repo = "service"
seed_path = "repo"
ci_source = "config/ci.yml"

[[steps]]
id = "seed-source-issue"
action = "issue.seed"
issue_id = "source"
repo = "service"
after = "temper.launch_standalone"

[[steps]]
id = "wait-for-convergence"
action = "workflow.wait_convergence"
strategy = "codebase-memory"
until = "engineer PR writes MEMORY_NOTES.md, CI passes, and the source issue closes"

[expect]
outcome = "The engineer receives codebase-memory AgentToolConfig through real Temper, sees only safe model-visible tools, calls search_code without project, receives the fake MCP result with the default project, writes MEMORY_NOTES.md from that result, submits for PR, and the PR lands through real CI."
merged_pull_requests = 1
closed_parent_issues = 1

[[expect.checks]]
required = true
id = "source-finalized"
artifact = "issue:source"
state = "closed"
labels = ["code"]

[[expect.checks]]
required = true
id = "implementation-pr-landed"
artifact = "pull_request"
state = "merged"
labels_cleared = ["landing"]
ci = "passed"

[[expect.checks]]
required = true
id = "default-branch-has-engineer-diff"
artifact = "repo:service"
branch = "main"
contains_engineer_diff = true

[[expect.events]]
required = true
id = "tool-configured"
event = "agent.tool.configured"
fields."tool.name" = "codebase_memory"
fields.role = "engineer"
fields.mode = "required"
fields.index = "blocking"
fields."tool.model_visible" = false

[[expect.events]]
required = true
id = "safe-search-tool-exposed"
event = "agent.tool.exposed"
fields."tool.name" = "codebase_memory_search_code"
fields."mcp.tool" = "search_code"
fields."tool.model_visible" = true
fields."mcp.project" = "actual-demo-project"

[[expect.events]]
required = true
id = "internal-index-tool-hidden"
event = "agent.tool.hidden"
fields."tool.name" = "codebase_memory_index_repository"
fields."mcp.tool" = "index_repository"
fields."tool.model_visible" = false

[[expect.events]]
required = true
id = "unsafe-delete-tool-hidden"
event = "agent.tool.hidden"
fields."tool.name" = "codebase_memory_delete_project"
fields."mcp.tool" = "delete_project"
fields."tool.model_visible" = false

[[expect.events]]
required = true
id = "mcp-server-started"
event = "mcp.server.started"
fields."tool.name" = "codebase_memory"

[[expect.events]]
required = true
id = "search-code-called-with-default-project"
event = "mcp.tool.called"
fields."tool.name" = "codebase_memory_search_code"
fields."mcp.tool" = "search_code"
fields."mcp.project" = "actual-demo-project"

[[expect.events]]
required = true
id = "fake-mcp-result-observed"
event = "mcp.tool.result"
fields."tool.name" = "codebase_memory_search_code"
fields."mcp.tool" = "search_code"
fields."mcp.project" = "actual-demo-project"
fields."result.preview" = "FAKE_MCP_SEARCH_RESULT project=actual-demo-project query=WidgetService"

[[expect.events]]
required = true
id = "workspace-diff-produced"
event = "workspace.diff.produced"
fields.repo = "acme/demo"
fields."file.path" = "MEMORY_NOTES.md"

[[expect.events]]
required = true
id = "agent-finished"
event = "agent.finished"
role = "engineer"

[[expect.sequence]]
required = true
id = "codebase-memory-agent-tool-flow"
scope = "source_artifact"
events = [
  { event = "agent.tool.configured", fields = { "tool.name" = "codebase_memory" } },
  { event = "mcp.server.started", fields = { "tool.name" = "codebase_memory" } },
  { event = "agent.tool.exposed", fields = { "tool.name" = "codebase_memory_search_code" } },
  { event = "mcp.tool.called", fields = { "mcp.tool" = "search_code", "mcp.project" = "actual-demo-project" } },
  { event = "mcp.tool.result", fields = { "mcp.tool" = "search_code" } },
  { event = "agent.finished", role = "engineer" },
  { event = "workspace.diff.produced", fields = { "file.path" = "MEMORY_NOTES.md" } },
]

[[expect.count]]
required = true
id = "search-code-called-once"
event = "mcp.tool.called"
fields."mcp.tool" = "search_code"
exactly = 1

[codebase_memory]
mode = "required"
index = "blocking"
fake_mcp_tools = ["search_code", "list_projects", "index_status", "index_repository", "delete_project"]
model_callable_safe_tools = ["codebase_memory_search_code", "codebase_memory_list_projects", "codebase_memory_index_status"]
model_forbidden_tools = ["codebase_memory_index_repository", "codebase_memory_delete_project"]
default_project = "acme/demo"
actual_project = "actual-demo-project"
search_code_call_omits_project = true
expected_output_name = "MEMORY_NOTES.md"
expected_result = "FAKE_MCP_SEARCH_RESULT"

[change_policy]
validation_report_required = true
promotion_artifact = "checked-in"
examples_changed = false
fixture_paths_must_exist = true
compatible_changes = [
  "Clarify scenario documentation without changing the fake MCP contract.",
  "Add evidence lines or structured event assertions that further narrow the same codebase-memory agent contract.",
]
requires_new_scenario_or_major_update = [
  "Removing workspace defaulting or safe-tool filtering from the validation contract.",
  "Replacing the mandatory live Forgejo/Actions/Temper/Jig stack with a lower-level test topology.",
]
