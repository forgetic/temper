# Bundled CI workflow for the reference-delivery example.
#
# `temper init` intentionally creates an empty/non-auto-initialized repository and
# does not seed project content. run.sh commits this file explicitly as
# `.forgejo/workflows/ci.yml` in the repository's first default-branch commit,
# alongside a tiny README, before `temper serve standalone` starts.
#
# It runs directly on the host (`runs-on: host`, no containers) because the
# bundled forgejo-runner is registered in host mode. The reviewer-gated demo only
# needs a real CI signal that ordinary jig-authored product diffs can pass; a
# real project replaces this with its own build/test/lint workflow.
name: ci
on: [push]
jobs:
  build:
    runs-on: host
    steps:
      - name: reference-delivery demo build
        run: |
          echo "reference-delivery demo CI: validating engineer PR head ${GITHUB_SHA}"
          echo "ok"
