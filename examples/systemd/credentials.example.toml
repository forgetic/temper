# Example credentials loaded with systemd LoadCredential=credentials.toml:...
# Copy to /etc/temper/credentials.toml, replace placeholders, chmod 0600.
schema_version = 1

[forge.users.bot]
user = "temper-bot"
password = "<bot-web-password>"
token = "<bot-rest-token>"

[forge.users.architect]
password = "<architect-web-password>"
token = "<architect-rest-token>"

[forge.users.engineer]
password = "<engineer-web-password>"
token = "<engineer-rest-token>"

[forge.users.reviewer]
password = "<reviewer-web-password>"
token = "<reviewer-rest-token>"

[agent.providers.anthropic]
type = "oauth"
access = "<oauth-access-token>"
refresh = "<oauth-refresh-token>"
expires = 0

# Static-key providers use this shape instead:
# [agent.providers.deepseek]
# type = "api-key"
# key = "<provider-api-key>"
