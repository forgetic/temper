# Example credentials loaded by the units with
# LoadCredential=credentials.toml:/etc/temper/credentials.toml.
# Replace every placeholder and install as mode 0600.
schema_version = 1

# Named references used by config.example.toml. Structured provider entries are
# converted to the worker-to-agent credential envelope without exposing values
# on argv or in `temper config show`.
[secrets.engine-forge-token]
kind = "forge-token"
token = "example-engine-forge-token-replace-me"

[secrets.webhook-secret]
kind = "webhook-secret"
value = "example-webhook-hmac-secret-replace-me"

[secrets.worker-architects-token]
kind = "worker-token"
token = "example-architects-worker-token-replace-me"

[secrets.worker-engineers-token]
kind = "worker-token"
token = "example-engineers-worker-token-replace-me"

[secrets.worker-reviewers-token]
kind = "worker-token"
token = "example-reviewers-worker-token-replace-me"

[secrets.worker-local-token]
kind = "worker-token"
token = "example-local-worker-token-replace-me"

[secrets.planning-provider-credentials]
kind = "provider-credentials"
provider = "deepseek"
auth = "api-key"
api_key = "example-planning-provider-key-replace-me"

[secrets.coding-provider-credentials]
kind = "provider-credentials"
provider = "deepseek"
auth = "api-key"
api_key = "example-coding-provider-key-replace-me"

# Legacy Forge identities remain required during migration: bot supplies
# provisioning and CI web-UI credentials, and role entries supply Git identity
# tokens for each worker pool.
[forge.users.bot]
user = "temper-bot"
email = "temper-bot@forge.example.com"
password = "example-bot-web-password-replace-me"
token = "example-bot-rest-token-replace-me"

[forge.users.architect]
user = "temper-architect"
email = "temper-architect@forge.example.com"
password = "example-architect-web-password-replace-me"
token = "example-architect-rest-token-replace-me"

[forge.users.engineer]
user = "temper-engineer"
email = "temper-engineer@forge.example.com"
password = "example-engineer-web-password-replace-me"
token = "example-engineer-rest-token-replace-me"

[forge.users.reviewer]
user = "temper-reviewer"
email = "temper-reviewer@forge.example.com"
password = "example-reviewer-web-password-replace-me"
token = "example-reviewer-rest-token-replace-me"

# Profile-less pools still resolve the legacy top-level Anthropic provider while
# an existing deployment migrates to named agent profiles.
[agent.providers.anthropic]
type = "oauth"
access = "example-anthropic-access-token-replace-me"
refresh = "example-anthropic-refresh-token-replace-me"
expires = 4102444800000
