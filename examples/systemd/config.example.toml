# Target-era split-runtime Temper config for systemd.
# Copy to /etc/temper/config.toml and edit the Forge/repository values.
schema_version = 1

[deployment]
name = "acme-production"
topology = "distributed"
# Absolute signal-to-exit budget used only by `temper serve standalone`.
# TimeoutStopSec in temper-standalone.service is 45s, leaving a 15s margin.
standalone_shutdown_budget_secs = 30

# Relative paths are resolved from the directory containing config.toml.
[workflow]
file = "workflow.example.yaml"

[paths]
state_dir = "/var/lib/temper"
workspace_dir = "/var/lib/temper/workspace"

[forge]
type = "forgejo"
url = "https://forge.example.com"
# These legacy identity keys remain during migration for provisioning, role Git
# identities, and the Forgejo web-UI CI fallback.
admin = "bot"
ci_user = "bot"

[engine]
bind = "0.0.0.0:4000"
repos = ["acme/service"]
roles = ["architect", "engineer", "reviewer"]
poll_cadence_secs = 300
# Dedicated polling for terminal CI changes when Actions-completion webhooks are
# unavailable. Set 0 to disable terminal-CI and missing-current-head detection;
# poll_cadence_secs remains the full backstop.
ci_poll_cadence_secs = 60
# Positive grace before continuously missing exact-head CI becomes actionable.
# This remains configured but inactive when ci_poll_cadence_secs is 0.
ci_missing_grace_secs = 300
mechanical_cadence_secs = 120
lease_ttl_secs = 300
forge_token = "engine-forge-token"
webhook_secret = "webhook-secret"

[worker]
daemon_url = "http://127.0.0.1:4000"
git_base_url = "https://forge.example.com"
# Retained as the profile-less/no-pool migration fallback.
max_concurrent_jobs = 1
# Worker-owned liveness supervision. Keep heartbeat_interval_ms below the
# no-progress interval; cancellation graces must sum to less than it.
max_no_progress_secs = 900
# max_run_secs = 7200
# heartbeat_interval_ms = 10000
graceful_cancellation_grace_secs = 10
forced_termination_grace_secs = 5

[[worker.pools]]
name = "architects"
roles = ["architect"]
repos = ["acme/service"]
max_concurrent_jobs = 1
agent_profile = "planning"
worker_token = "worker-architects-token"

[[worker.pools]]
name = "engineers"
roles = ["engineer"]
repos = ["acme/service"]
max_concurrent_jobs = 2
agent_profile = "coding"
worker_token = "worker-engineers-token"

[[worker.pools]]
name = "reviewers"
roles = ["reviewer"]
repos = ["acme/service"]
max_concurrent_jobs = 1
agent_profile = "planning"
worker_token = "worker-reviewers-token"

# This `local` pool makes the same checked bundle runnable with
# `temper serve standalone`; standalone selects local/default when several
# target-era pools are present.
[[worker.pools]]
name = "local"
roles = ["architect", "engineer", "reviewer"]
repos = ["acme/service"]
max_concurrent_jobs = 1
worker_token = "worker-local-token"

# The top-level provider remains the profile-less pool migration fallback.
[agent]
provider = "anthropic"
max_iterations = 120
enable_subagents = false

[agent.deadlines]
tool_timeout_secs = 600
model_connect_timeout_secs = 120
model_idle_timeout_secs = 120

[agent.providers.anthropic]
models = { main = "claude-opus-4-8", investigate = "claude-haiku-4-5" }

[agent.profiles.planning]
command = ["temper", "agent"]
provider = "deepseek"
model = "deepseek-chat"
investigate_model = "deepseek-chat"
max_iterations = 80
subagents = false
credential = "planning-provider-credentials"

[agent.profiles.coding]
command = ["temper", "agent"]
provider = "deepseek"
model = "deepseek-chat"
investigate_model = "deepseek-chat"
max_iterations = 250
subagents = true
credential = "coding-provider-credentials"
