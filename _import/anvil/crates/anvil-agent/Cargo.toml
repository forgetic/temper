[package]
name = "anvil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sans-IO LLM agent loop for anvil: a pure AgentMachine driven by a skein shell that reuses tongs providers and tools."

[dependencies]
async-trait = "0.1"
skein.workspace = true
futures = "0.3"
tongs.workspace = true
serde.workspace = true
serde_json.workspace = true
anvil-io-engine = { path = "../anvil-io-engine" }

[dev-dependencies]
anvil-io-engine = { path = "../anvil-io-engine" }
anvil-temper-agent = { path = "../anvil-temper-agent", features = ["test-provider-base-url-override"] }
jig-server = { path = "../../../jig/crates/jig-server" }
jig-core = { path = "../../../jig/crates/jig-core" }

[lints]
workspace = true
