[workspace]
members = [
    "crates/anvil-agent",
    "crates/anvil-io-engine",
    "crates/anvil-temper-agent",
]
resolver = "2"

# The project binaries are minimal glue around the library crates and live in
# src/bin/ (same pattern as temper). Crates under crates/ are libraries only.
[package]
name = "anvil"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "anvil: an out-of-process coding agent implementing smith's agent process protocol."

[features]
default = []
test-provider-base-url-override = ["anvil-temper-agent/test-provider-base-url-override"]

[dependencies]
anvil-agent = { path = "crates/anvil-agent" }
anvil-io-engine = { path = "crates/anvil-io-engine" }
anvil-temper-agent = { path = "crates/anvil-temper-agent" }
async-trait = "0.1"
serde_json.workspace = true
skein.workspace = true
smith-agent-protocol = { path = "../smith/crates/smith-agent-protocol" }
temper-process-protocol = { path = "../temper/crates/temper-process-protocol" }

[dev-dependencies]
jig-core = { path = "../jig/crates/jig-core" }
jig-server = { path = "../jig/crates/jig-server" }

[[bin]]
name = "anvil"
path = "src/bin/anvil.rs"

[[bin]]
name = "anvil-agent"
path = "src/bin/anvil-agent.rs"

[[bin]]
name = "anvil-product-manager-responder"
path = "src/bin/anvil-product-manager-responder.rs"

[[bin]]
name = "anvil-workflow-role-decision"
path = "src/bin/anvil-workflow-role-decision.rs"

[lints]
workspace = true

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# skein's let-chain usage sets the floor at 1.88 — same as smith/temper, whose
# serde DTO crates this repo depends on by path.
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
# anvil is the agent side of the agent/orchestration split: it owns the agent
# loop on tongs (the clean-room agent SDK) and skein (the runtime);
# smith-worker spawns its binary over a versioned process protocol.
skein = { path = "../skein/crates/skein", features = ["tls", "tls-native-roots"] }
tongs = { path = "../tongs/crates/tongs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false

[profile.dev.package."*"]
debug = 0

[profile.test]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false
