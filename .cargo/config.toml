# Local development defaults.
#
# Keep `build.jobs` unset: Cargo's default is to use all available logical CPU
# cores. Agents should not add a fixed job count unless a task explicitly needs
# reproducible resource limits.

# Note on caching (kache): all dev-* aliases use `--all-targets` deliberately.
# Cargo unifies features across the build graph, and `--all-targets` pulls in
# dev-dependencies (e.g. temper-testing) that enable extra features on shared
# deps — notably skein's `tls-webpki-roots`. Narrowing an alias to `--lib
# --bins` resolves a DIFFERENT unified feature set, so skein and its entire
# downstream tree (tokio, hyper-util, …) compile under a feature combo no other
# build shares and miss the cache wholesale. Keep every alias on `--all-targets`
# so the test build and the lint pass key-match and share cached lib artifacts.
#
# (clippy/check still produce zero-byte leaf `.rmeta` that kache cannot cache,
# so the leaf check-only targets always recompile; that cost is small and
# unavoidable. The real win is the shared, cacheable lib compiles below.)

[alias]
dev-check = "check --workspace --all-targets"
dev-clippy = "clippy --workspace --all-targets"
dev-test-quick = "test --workspace --all-targets"
dev-test-build = "test --workspace --all-targets --no-run"
dev-test-full = "nextest run --workspace --run-ignored all --no-fail-fast"
dev-doc = "doc --workspace --no-deps"

# Editing a sibling repo (skein, jig, tongs, bench) alongside temper.
#
# The siblings are git dependencies pinned by rev so the build-cache key is
# checkout-location-independent (a path dependency bakes the absolute checkout
# path into Cargo's -Cmetadata, which diverges between local and CI and misses
# the warm cache wholesale). To pick up uncommitted local sibling changes,
# redirect the git source to your local checkout with a [patch] override.
#
# Cargo honours [patch] from this config file (Cargo 1.11+), so you do NOT need
# to touch Cargo.toml. Uncomment the lines for the sibling you are editing,
# adjusting the paths to your checkout layout (defaults assume flat siblings
# under ../). DO NOT COMMIT an active patch — it would point CI at paths that
# do not exist there. (Each git key must match the dependency URL in Cargo.toml
# exactly, including the http://127.0.0.1:3000 host.)
#
# [patch."http://127.0.0.1:3000/ai/skein.git"]
# skein = { path = "../skein/crates/skein" }
#
# [patch."http://127.0.0.1:3000/ai/jig.git"]
# jig-core = { path = "../jig/crates/jig-core" }
# jig-server = { path = "../jig/crates/jig-server" }
# jig-record = { path = "../jig/crates/jig-record" }
# jig-runtime = { path = "../jig/crates/jig-runtime" }
#
# [patch."http://127.0.0.1:3000/ai/tongs.git"]
# tongs = { path = "../tongs/crates/tongs" }
#
# [patch."http://127.0.0.1:3000/ai/bench.git"]
# bench-forgejo = { path = "../bench/crates/bench-forgejo" }
