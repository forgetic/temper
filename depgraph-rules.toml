# depgraph-rules.toml
#
# Architectural dependency-graph rules for the temper workspace, enforced in CI
# with `cargo depgraph-check check` (https://github.com/1898andCo/cargo-depgraph-check).
#
# The pipeline is a three-tier stack:   engine  →  worker  →  agent
# Each tier may depend on its own internal crates plus the *leaf protocol crate*
# at its boundary — never on the implementation crates of another tier.
#
#   temper-protocol-worker    engine <-> worker boundary (daemon exposes; worker consumes)
#   temper-protocol-agent     worker <-> agent  boundary (worker exposes; agent consumes)
#   temper-protocol-interaction conversation/proposal responder contract (leaf, no deps)
#
# Each value below is the COMPLETE allowlist of internal deps for that crate;
# any internal dependency not listed is a violation. Dev-dependencies are NOT
# checked (`check_dev_deps = false`), which is what lets e2e/integration tests
# cross tiers freely (e.g. the worker's tests drive the daemon + a fake agent).
#
# ---------------------------------------------------------------------------
# INVARIANT: concrete forge backends stay out of business logic.
# ---------------------------------------------------------------------------
# The forge layer is split so that no business-logic crate ever names a concrete
# backend:
#
#   temper-forge-model    the Forge trait + backend-agnostic domain model.
#   temper-forge-forgejo  }
#   temper-forge-github   }  concrete backends implementing the model's traits.
#   temper-forge-memory   }  Each depends ONLY on temper-forge-model.
#   temper-forge-filesystem }
#   temper-forge          the FACADE: re-exports temper-forge-model and offers a
#                         backend factory (new_forgejo/new_github/new_memory/
#                         new_filesystem -> Arc<dyn Forge>). The ONLY non-test
#                         crate allowed to depend on the concrete backends.
#
# Every other crate depends on `temper-forge` (the facade) and receives an
# abstract `Arc<dyn Forge>` (or `Arc<dyn ProvisioningForge>` for provisioning).
# A concrete backend dep (temper-forge-forgejo / -github / -memory / -filesystem)
# on any crate OTHER than temper-forge therefore fails this check — that is the
# enforcement of the invariant.
#
# THE ONE EXCEPTION is `temper-testing`, the sim/e2e harness: it keeps direct
# backend deps for test-only affordances that are not on the production Forge
# trait (e.g. MemoryForge::seed_ci_jobs, FilesystemForge::as_user/root). It is
# non-shipping test machinery and is documented as the sole allowed exception.
# (Other crates' e2e helpers reach for concrete backends only via *dev*-deps,
# which this check ignores — see check_dev_deps below.)

[rules]

# ===========================================================================
# ENGINE / CORE layer — the foundation that everything builds on. Must not
# depend on any worker- or agent-implementation crate; only on other engine
# crates and the leaf protocol crates the engine owns.
# ===========================================================================
temper-engine-io = []
# The backend-agnostic forge model: Forge trait + domain types. Leaf.
temper-forge-model = []
temper-protocol-interaction = []
temper-protocol-worker = []
temper-worker-registry = ["temper-protocol-worker"]
# Concrete backends — each implements the model's traits and depends ONLY on the
# model (plus engine-io for the HTTP backends). They are wired into the system
# exclusively through the temper-forge facade below.
temper-forge-filesystem = ["temper-forge-model"]
temper-forge-memory = ["temper-forge-model"]
temper-forge-forgejo = ["temper-forge-model", "temper-engine-io"]
temper-forge-github = ["temper-forge-model", "temper-engine-io"]
# The forge FACADE: the single seam where concrete backends are constructed and
# erased to `dyn Forge`. This is the ONLY non-test crate permitted to depend on
# the concrete backend crates. Everything downstream depends on this.
temper-forge = ["temper-forge-model", "temper-forge-forgejo", "temper-forge-github", "temper-forge-memory", "temper-forge-filesystem"]
temper-workflow = ["temper-forge"]
temper-interaction = ["temper-forge", "temper-engine-io", "temper-protocol-interaction"]
temper-runner = ["temper-forge", "temper-engine-io", "temper-log", "temper-workflow"]
temper-wake = ["temper-engine-io", "temper-runner"]
temper-reference-delivery = ["temper-forge", "temper-runner", "temper-workflow"]
# Validates live forge state. Builds its forge through the facade factory; no
# concrete backend dep.
temper-reference-delivery-validator = ["temper-forge", "temper-engine-io", "temper-workflow"]
# Deploys interaction profiles. Builds its forges through the facade factory.
temper-interaction-service = ["temper-forge", "temper-interaction", "temper-engine-io"]
temper-trigger-forgejo = ["temper-forge", "temper-runner", "temper-wake"]
# Backend-agnostic provisioning orchestration: depends ONLY on the Forge traits
# (via the facade), the runner (for RoleBinding), and the workflow model.
temper-provision = ["temper-forge", "temper-runner", "temper-workflow"]
# Reference-delivery demo / operator CLI for `temper provision-forgejo`: builds a
# forge through the facade factory (new_forgejo_provisioning) and runs the
# backend-agnostic temper-provision orchestration. No concrete backend dep — the
# demo CI/intake bits live in temper-reference-delivery. Depends on temper-config
# to write provisioned secrets in the runtime's own credentials.toml format (the
# file the daemon loads via --secrets).
temper-provision-forgejo-cli = ["temper-config", "temper-forge", "temper-provision", "temper-engine-io", "temper-reference-delivery", "temper-runner", "temper-workflow"]
# The engine itself: serves the worker/daemon wire protocol. Touches only engine
# crates + the worker-protocol/worker-registry it owns. No worker/agent impls.
temper-engine = ["temper-forge", "temper-engine-io", "temper-log", "temper-runner", "temper-protocol-worker", "temper-worker-registry", "temper-workflow"]

# ===========================================================================
# WORKER layer (formerly smith). Long-polls the daemon and speaks ONLY the
# worker/daemon wire protocol upstream; owns the agent protocol downstream.
# Never depends on an engine- or agent-implementation crate (rule 2).
# ===========================================================================
temper-worker-io = []
temper-worker = ["temper-protocol-worker", "temper-worker-io", "temper-protocol-agent"]

# ===========================================================================
# AGENT layer (formerly anvil). Consumes the worker-exposed agent protocol.
# Never depends on a worker- or engine-implementation crate (rule 3).
# ===========================================================================
temper-agent-io = []
temper-protocol-agent = []
temper-agent-core = ["temper-agent-io"]
# NOTE / DIVERGENCE from rule 3: besides temper-protocol-agent (the protocol the
# worker exposes), the agent also depends on the engine-owned conversation /
# proposal responder contract it implements. It is a leaf serde contract with
# zero internal deps, so no implementation leaks across tiers; but it IS an
# additional upstream protocol. Drop it from this list if you want CI to force
# the agent down to exactly one protocol crate.
temper-agent = ["temper-agent-core", "temper-protocol-agent", "temper-protocol-interaction"]

# ===========================================================================
# COMPOSITION ROOT + shared test harnesses — span tiers by design, so they get
# broad allowlists rather than tier rules.
# ===========================================================================
# Tier-agnostic config: schema + resolution, no internal deps. A shared leaf
# (like the protocol crates) every binary can read config without linking a tier.
temper-config = []
# Scenario manifest parser/checker. Leaf library used by the standalone
# temper-scenario facade; it deliberately stays out of the engine/worker/agent tiers.
temper-scenario-core = []

# Process-wide logging init (tracing-subscriber setup). A shared leaf with no
# internal deps that every binary calls once at startup; like temper-config it
# crosses no tier.
temper-log = []

# Per-tier service crates. Each links ONLY its own tier + temper-config, and
# ships its slim binary (temper-engine / temper-worker / temper-agent). These
# allowlists ARE the proof of tier isolation. The engine service builds its forge
# through the facade factory — no concrete backend dep.
temper-engine-service = ["temper-config", "temper-engine", "temper-engine-io", "temper-forge", "temper-workflow", "temper-reference-delivery", "temper-log"]
temper-worker-service = ["temper-config", "temper-worker", "temper-worker-io", "temper-log"]
temper-agent-session = ["temper-config", "temper-agent", "temper-agent-core", "temper-agent-io", "temper-protocol-agent", "temper-log"]

# Reusable co-resident worker→daemon carrier. This is deliberate cross-tier
# composition glue kept out of `temper-worker` so slim worker builds do not
# depend on the engine, while standalone/sim/hermetic tests can share one real
# `Daemon` → `Transport` implementation.
temper-daemon-transport = ["temper-engine", "temper-protocol-worker", "temper-worker"]

# ---------------------------------------------------------------------------
# CLI crates. The monolithic composition root is split into a thin dispatcher
# (`temper-cli`) plus per-subcommand crates, so building one subcommand does not
# pull in another's deps. CLI crates own ONLY argv parsing, terminal I/O, exit
# codes, and orchestration — all real logic lives in the library crates.
# ---------------------------------------------------------------------------

# The lightest CLI crate: the Prompter terminal-I/O seam + argv/file helpers.
# Config + std + rpassword only (rpassword is the one new external dep, confined
# here). No internal deps beyond temper-config.
temper-cli-common = ["temper-config"]

# `temper config` (validate/show/init-template). Thin over temper-config; carries
# no engine/worker/agent deps.
temper-cli-config = ["temper-cli-common", "temper-config"]

# `temper daemon`: the standalone all-in-one + per-service runners. Inherits the
# heavy engine/worker/agent wiring the monolithic CLI used to carry (the
# in-process agent runner lives here; reusable worker→daemon transport glue is
# pulled from temper-daemon-transport). Builds its forge through the facade
# factory — no concrete backend dep.
temper-cli-daemon = ["temper-config", "temper-log", "temper-engine-service", "temper-worker-service", "temper-agent-session", "temper-agent", "temper-protocol-agent", "temper-daemon-transport", "temper-engine", "temper-engine-io", "temper-forge", "temper-reference-delivery", "temper-worker", "temper-protocol-worker", "temper-workflow"]

# `temper init`: interactive first-run. Orchestration only — config writing in
# temper-config, provisioning inlined directly via temper-provision. Builds its
# forge through the facade factory — no concrete backend dep.
temper-cli-init = ["temper-cli-common", "temper-config", "temper-provision", "temper-forge", "temper-engine-io", "temper-workflow", "temper-reference-delivery"]

# The thin dispatcher: routes argv to the per-subcommand crates and the hidden
# operator/responder tools. Re-exports the in-process transport from
# temper-cli-daemon. Much slimmer than the old monolith.
temper-cli = ["temper-config", "temper-cli-common", "temper-cli-init", "temper-cli-config", "temper-cli-daemon", "temper-agent-session", "temper-agent", "temper-agent-io", "temper-protocol-interaction", "temper-provision-forgejo-cli", "temper-interaction-service", "temper-reference-delivery-validator", "temper-trigger-forgejo", "temper-log"]

# Standalone scenario facade. Listing/checking stays in the manifest core; the
# first deterministic `run` path composes runner/test-harness primitives over the
# memory backend so it can exercise basic-delivery without live services.
temper-scenario-cli = ["temper-scenario-core", "temper-runner", "temper-testing", "temper-forge-model", "temper-forge-memory"]

# The unified `temper` binary's composition root (`src/bin/temper.rs`'s `boot()`)
# snapshots the real environment into a CliEnv via temper-config's env shims, so
# it depends on temper-config in addition to the temper-cli dispatcher.
temper = ["temper-cli", "temper-config"]
# Repo-local developer command driver for Cargo aliases that need to sequence
# other Cargo aliases. No internal deps.
temper-dev = []
# Deterministic sim harness: runs the real daemon under skein's lab runtime.
# It keeps the hand-rolled HTTP worker simulants for cheap/misbehavior paths and
# also composes the production WorkerMachine/WorkerShell over the reusable
# in-process daemon carrier for high-fidelity worker scenarios.
temper-sim = ["temper-daemon-transport", "temper-engine", "temper-engine-io", "temper-protocol-worker", "temper-worker"]
# The web dashboard (read-model, SSE fan-out, static UI, log-tail feed). A
# depgraph leaf: it is a UI consumer, never depended-upon by a tier crate. It
# runs its OWN dependency-light blocking std::net HTTP+SSE server (no skein —
# the daemon's one-shot H1 responder cannot hold a connection open for SSE), so
# it needs neither temper-engine-io nor temper-engine. It depends only on
# temper-log (the event vocabulary + WorkItemRef/strip_provider_scheme helpers it
# tails) and temper-workflow (lane derivation off the lifecycle state dimension).
# PR E adds temper-interaction for the conversation-proxy wire types: the
# `ConversationEvent` envelope + `ConversationEventPayload` enum live in
# temper-interaction's `transport` module (the protocol crate only has the inner
# turn/reply/proposal types), so depending on it is how the proxy reuses the exact
# JSON contract the chat UI consumes rather than re-declaring drift-prone parallel
# types. temper-web stays a leaf — nothing in any tier depends on it.
temper-web = ["temper-log", "temper-workflow", "temper-interaction"]
# Shared non-production test machinery. It spans tiers by design for reusable
# e2e/sim fixtures, including hermetic real-stack daemon+worker+agent builders.
# THE SOLE EXCEPTION to the
# forge-backend invariant: it depends directly on the concrete backends for
# test-only affordances absent from the production Forge trait (see the invariant
# note at the top of this file). It also links temper-forge-model directly for
# those concrete types alongside the temper-forge facade.
temper-testing = ["temper-forge", "temper-forge-model", "temper-forge-filesystem", "temper-forge-forgejo", "temper-forge-memory", "temper-engine", "temper-engine-io", "temper-daemon-transport", "temper-worker", "temper-agent", "temper-protocol-agent", "temper-reference-delivery", "temper-runner", "temper-trigger-forgejo", "temper-wake", "temper-protocol-worker", "temper-workflow"]

[options]
# Every workspace member must be listed above (a new, unlisted crate fails CI).
strict = true
# Do NOT check dev-dependencies — this is the e2e/integration-test exception:
# test code may cross tiers freely (worker tests use daemon code, and vice versa).
check_dev_deps = false
# A config entry naming a crate that no longer exists fails CI (keeps this file
# honest as crates are added/removed/renamed).
unmatched_config_entries = "error"
