[workspace]
members = [
    "crates/temper-daemon",
    "crates/temper-workflow",
    "crates/temper-forge",
    "crates/temper-process-protocol",
    "crates/temper-worker-protocol",
    "crates/temper-worker-registry",
    "crates/temper-interaction",
    "crates/temper-io-engine",
    "crates/temper-forge-filesystem",
    "crates/temper-forge-memory",
    "crates/temper-forge-forgejo",
    "crates/temper-forge-github",
    "crates/temper-runner",
    "crates/temper-testing",
    "crates/temper-reference-delivery",
    "crates/temper-wake",
    "crates/temper-forgejo-ops",
    "crates/temper-coding-workspace",
    "crates/temper-interaction-service",
    "crates/temper-trigger-forgejo",
    "crates/temper-forgejo-provision",
    "crates/temper-reference-delivery-validator",
    "crates/temper-worker",
]
resolver = "2"

[package]
name = "temper"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []

[dependencies]
asupersync = { workspace = true }
chrono = { workspace = true }
temper-daemon = { path = "crates/temper-daemon" }
temper-forge = { path = "crates/temper-forge" }
temper-forge-forgejo = { path = "crates/temper-forge-forgejo" }
temper-forgejo-provision = { path = "crates/temper-forgejo-provision" }
temper-interaction-service = { path = "crates/temper-interaction-service" }
temper-reference-delivery = { path = "crates/temper-reference-delivery" }
temper-reference-delivery-validator = { path = "crates/temper-reference-delivery-validator" }
temper-trigger-forgejo = { path = "crates/temper-trigger-forgejo" }
temper-worker = { path = "crates/temper-worker" }
temper-io-engine = { path = "crates/temper-io-engine" }
temper-workflow = { path = "crates/temper-workflow" }

[dev-dependencies]
# Daemon-topology e2e (`tests/daemon_forgejo_e2e.rs`): real Forgejo fixture,
# webhook registration, and PR/CI assertions against the spawned daemon binary.
serde_json = { workspace = true }
temper-forgejo-ops = { path = "crates/temper-forgejo-ops" }
temper-testing = { path = "crates/temper-testing" }

[[bin]]
name = "temper-daemon"
path = "src/bin/temper-daemon.rs"

[[bin]]
name = "temper-worker"
path = "src/bin/temper-worker.rs"

[[bin]]
name = "temper-provision-forgejo"
path = "src/bin/temper-provision-forgejo.rs"

[[bin]]
name = "temper-trigger-forgejo"
path = "src/bin/temper-trigger-forgejo.rs"

[[bin]]
name = "temper-validate-reference-delivery"
path = "src/bin/temper-validate-reference-delivery.rs"

[[bin]]
name = "temper-interaction"
path = "src/bin/temper-interaction.rs"

[lints]
workspace = true

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Pinned to 0.3.1, the same version the pi-sdk coding agent stack uses. The
# crate is vendored (see [patch.crates-io] below) so it builds on rustc 1.85:
# the vendored copy enables the post-1.85 feature gates it relies on, compiled
# with a crate-scoped RUSTC_BOOTSTRAP set in .cargo/config.toml. Keep the
# transitive pins in Cargo.lock with:
#
#   cargo update -p virtue-next --precise 0.1.2
#   cargo update -p franken-decision --precise 0.3.1
#   cargo update -p franken-kernel --precise 0.3.1
#
# (franken-* 0.3.4 and virtue-next 0.1.3 need rustc >= 1.86.)
asupersync = "=0.3.1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# rustc 1.85 compatibility patches; see vendor/README.md.
[patch.crates-io]
asupersync = { path = "vendor/asupersync" }
asupersync-macros = { path = "vendor/asupersync-macros" }
franken-evidence = { path = "vendor/franken-evidence" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Fast local iteration is the default. Production/release profiles can be tuned
# later when we have deployable artifacts. Cargo uses all available logical CPU
# cores by default; keep `.cargo/config.toml` free of a fixed `build.jobs` value.
[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false

[profile.dev.package."*"]
debug = 0

[profile.test]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false
