[workspace]
members = [
    "crates/temper-engine",
    "crates/temper-workflow",
    "crates/temper-forge",
    "crates/temper-process-protocol",
    "crates/temper-worker-protocol",
    "crates/temper-worker-registry",
    "crates/temper-interaction",
    "crates/temper-io-engine",
    "crates/temper-forge-filesystem",
    "crates/temper-forge-memory",
    "crates/temper-forge-forgejo",
    "crates/temper-forge-github",
    "crates/temper-runner",
    "crates/temper-testing",
    "crates/temper-reference-delivery",
    "crates/temper-wake",
    "crates/temper-forgejo-ops",
    "crates/temper-interaction-service",
    "crates/temper-trigger-forgejo",
    "crates/temper-forgejo-provision",
    "crates/temper-reference-delivery-validator",
    "crates/temper-sim",
    # Merged from smith (the orchestration worker):
    "crates/temper-agent-protocol",
    "crates/temper-worker-io-engine",
    "crates/temper-worker",
    # Merged from anvil (the coding/decision agent):
    "crates/temper-agent-core",
    "crates/temper-agent-io-engine",
    "crates/temper-agent",
]
resolver = "2"

[package]
name = "temper"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The default is the everything-binary: one `temper` that does daemon + worker
# + agent + operator tools. Custom distributed deployments can strip to a
# single role with `--no-default-features --features <role>`.
default = ["unified"]

# Capability features — each gates the crates and subcommands for one role.
daemon = [
    "dep:temper-engine",
    "dep:temper-forge",
    "dep:temper-forge-forgejo",
    "dep:temper-forgejo-provision",
    "dep:temper-interaction-service",
    "dep:temper-reference-delivery",
    "dep:temper-reference-delivery-validator",
    "dep:temper-trigger-forgejo",
    "dep:temper-io-engine",
    "dep:temper-workflow",
    "dep:chrono",
]
worker = [
    "dep:temper-worker",
    "dep:temper-worker-io-engine",
    "dep:temper-worker-protocol",
    "dep:temper-agent-protocol",
]
# The agent pulls tongs + jig + the LLM/HTTP stack. Worker/daemon-only builds
# omit this feature and never compile it.
agent = [
    "dep:temper-agent",
    "dep:temper-agent-core",
    "dep:temper-agent-io-engine",
    "dep:temper-agent-protocol",
    "dep:temper-process-protocol",
    "dep:async-trait",
    "dep:serde_json",
]

# Profile feature: the unified everything-binary.
unified = ["daemon", "worker", "agent"]

[dependencies]
# Always present (shared, cheap): the runtime.
skein = { workspace = true }

# Gated, optional — pulled in by the capability features above.
async-trait = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
temper-engine = { path = "crates/temper-engine", optional = true }
temper-forge = { path = "crates/temper-forge", optional = true }
temper-forge-forgejo = { path = "crates/temper-forge-forgejo", optional = true }
temper-forgejo-provision = { path = "crates/temper-forgejo-provision", optional = true }
temper-interaction-service = { path = "crates/temper-interaction-service", optional = true }
temper-reference-delivery = { path = "crates/temper-reference-delivery", optional = true }
temper-reference-delivery-validator = { path = "crates/temper-reference-delivery-validator", optional = true }
temper-trigger-forgejo = { path = "crates/temper-trigger-forgejo", optional = true }
temper-io-engine = { path = "crates/temper-io-engine", optional = true }
temper-workflow = { path = "crates/temper-workflow", optional = true }
# worker
temper-worker = { path = "crates/temper-worker", optional = true }
temper-worker-io-engine = { path = "crates/temper-worker-io-engine", optional = true }
temper-worker-protocol = { path = "crates/temper-worker-protocol", optional = true }
# agent (heavy: tongs + jig + LLM/HTTP enter only here)
temper-agent = { path = "crates/temper-agent", optional = true }
temper-agent-core = { path = "crates/temper-agent-core", optional = true }
temper-agent-io-engine = { path = "crates/temper-agent-io-engine", optional = true }
# shared protocol DTOs (worker↔agent and role-decision)
temper-agent-protocol = { path = "crates/temper-agent-protocol", optional = true }
temper-process-protocol = { path = "crates/temper-process-protocol", optional = true }

[dev-dependencies]
# Daemon-topology e2e (`tests/daemon_forgejo_e2e.rs`): real Forgejo fixture,
# webhook registration, and PR/CI assertions against the spawned daemon binary.
# The default (`unified`) feature set compiles the daemon stack these need.
serde_json = { workspace = true }
temper-forgejo-ops = { path = "crates/temper-forgejo-ops" }
temper-testing = { path = "crates/temper-testing" }
# `temper run` e2e (`tests/run_forgejo_e2e.rs`): real bench Forgejo fixture +
# jig fake LLM, driving one in-process `temper run`. Needs the forge API for PR
# assertions and jig for the canned engineer-agent replies.
temper-forge = { path = "crates/temper-forge" }
temper-forge-forgejo = { path = "crates/temper-forge-forgejo" }
temper-workflow = { path = "crates/temper-workflow" }
temper-io-engine = { path = "crates/temper-io-engine" }
jig-core = { git = "http://127.0.0.1:3000/ai/jig.git", rev = "6e645dde7d263ee2940d2965267cbc37fc302bfb" }
jig-server = { git = "http://127.0.0.1:3000/ai/jig.git", rev = "6e645dde7d263ee2940d2965267cbc37fc302bfb" }
# `examples/checkpoint_progress_to_issue`: replays agent step-progress markers
# through the daemon's apply_progress against an in-memory forge.
temper-forge-memory = { path = "crates/temper-forge-memory" }
temper-worker-protocol = { path = "crates/temper-worker-protocol" }

# Unified everything-binary: `temper run` + `temper daemon|worker|agent|...`.
[[bin]]
name = "temper"
path = "src/bin/temper.rs"
required-features = ["unified"]

# Role split binaries — each compiles only its role's code.
[[bin]]
name = "temper-daemon"
path = "src/bin/temper-daemon.rs"
required-features = ["daemon"]

[[bin]]
name = "temper-worker"
path = "src/bin/temper-worker.rs"
required-features = ["worker"]

[[bin]]
name = "temper-agent"
path = "src/bin/temper-agent.rs"
required-features = ["agent"]

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# skein (the vendored async runtime) uses edition-2024 and let-chains; nothing
# in temper itself needs more than 1.88.
rust-version = "1.88"

[workspace.dependencies]
# skein: our maintained, MIT, cancel-correct async runtime (a clean-room fork of
# asupersync 0.2.4 — the last plain-MIT upstream release; 0.2.5+ carry an
# OpenAI/Anthropic license rider and 0.3.3+ require nightly). Lives in its own
# repo at ../skein and is shared across projects (temper, smith, …).
#
# TLS features are enabled because the merged agent crates (formerly anvil)
# reach LLM providers over HTTPS. skein is needed by every role and so cannot be
# an optional/feature-gated dependency; cargo unifies features across the graph,
# so worker/daemon-only builds also link skein's TLS code. This is an accepted
# tradeoff — TLS is small relative to the agent's LLM/HTTP stack, which slim
# builds still exclude (it enters only via the `agent` feature crates).
# `tls-webpki-roots` is enabled here even though no temper crate needs the
# webpki root bundle directly: a dev-dependency (jig-record, via
# temper-agent) enables it, so test-scoped builds resolve skein with it
# while non-test builds resolve it without. That feature split forced skein —
# and its entire ~20-crate reverse-dependency tree — to recompile under two
# different keys every CI run, defeating the build cache. Enabling it
# unconditionally costs only a small static root bundle and keeps skein's
# resolved feature set identical across every build, so the cache is shared.
skein = { git = "http://127.0.0.1:3000/ai/skein.git", rev = "d2c98ecbad0825cdfef7feeb58f1e7f7e4f4d853", features = [
    "tls",
    "tls-native-roots",
    "tls-webpki-roots",
] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Merged-in agent stack (formerly anvil) and worker (formerly smith).
tongs = { git = "http://127.0.0.1:3000/ai/tongs.git", rev = "de509a589cfe01970d406e0430237be9e206ab0d" }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
