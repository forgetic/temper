[workspace]
members = [
    "crates/temper-config",
    "crates/temper-engine-service",
    "crates/temper-worker-service",
    "crates/temper-agent-session",
    "crates/temper-cli",
    "crates/temper-cli-common",
    "crates/temper-cli-config",
    "crates/temper-cli-daemon",
    "crates/temper-cli-init",
    "crates/temper-engine",
    # Cross-tier composition glue for co-resident daemon/worker stacks; kept
    # outside temper-worker so slim worker builds do not link temper-engine.
    "crates/temper-daemon-transport",
    "crates/temper-workflow",
    "crates/temper-forge-model",
    "crates/temper-forge",
    "crates/temper-protocol-interaction",
    "crates/temper-protocol-worker",
    "crates/temper-worker-registry",
    "crates/temper-interaction",
    "crates/temper-log",
    "crates/temper-engine-io",
    "crates/temper-forge-filesystem",
    "crates/temper-forge-memory",
    "crates/temper-forge-forgejo",
    "crates/temper-forge-github",
    "crates/temper-runner",
    "crates/temper-testing",
    "crates/temper-reference-delivery",
    "crates/temper-wake",
    "crates/temper-provision",
    "crates/temper-interaction-service",
    "crates/temper-trigger-forgejo",
    "crates/temper-provision-forgejo-cli",
    "crates/temper-reference-delivery-validator",
    "crates/temper-sim",
    # Tiny repo-local driver for developer aliases that need to sequence cargo
    # commands.
    "crates/temper-dev",
    # The web dashboard (its own HTTP/SSE server + the bundled TS UI in ui/).
    "crates/temper-web",
    # Merged from smith (the orchestration worker):
    "crates/temper-protocol-agent",
    "crates/temper-worker-io",
    "crates/temper-worker",
    # Merged from anvil (the coding/decision agent):
    "crates/temper-agent-core",
    "crates/temper-agent-io",
    "crates/temper-agent",
]
resolver = "2"

[package]
name = "temper"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The unified binary is a one-line shim over the CLI composition root, which
# wires every tier together. The slim per-service binaries (`temper-engine`,
# `temper-worker`, `temper-agent`) live in their service crates and link only
# their own tier — built with `cargo build -p temper-{engine-service,
# worker-service,agent-session}`.
temper-cli = { path = "crates/temper-cli" }
# The composition root (`src/bin/temper.rs`'s `boot()`) snapshots the real
# environment into a CliEnv via temper-config's `EnvMap`/`PathResolver` shims.
temper-config = { path = "crates/temper-config" }

[dev-dependencies]
# Root live e2es (`tests/daemon_forgejo_e2e.rs`,
# `tests/basic_delivery_forgejo_e2e.rs`): real Forgejo fixture, webhook
# registration, and PR/CI assertions against spawned daemon/standalone binaries.
# The default (`unified`) feature set compiles the daemon stack these need.
serde_json = { workspace = true }
temper-testing = { path = "crates/temper-testing" }
# Root Forgejo e2e assertions construct ForgejoForge directly for PR, CI, and
# repository-state checks. Dev-dependencies are exempt from the depgraph backend
# rule.
temper-forge = { path = "crates/temper-forge" }
temper-forge-forgejo = { path = "crates/temper-forge-forgejo" }
temper-workflow = { path = "crates/temper-workflow" }
temper-engine = { path = "crates/temper-engine" }
temper-engine-io = { path = "crates/temper-engine-io" }
temper-daemon-transport = { path = "crates/temper-daemon-transport" }
temper-worker = { path = "crates/temper-worker" }
# Root basic-delivery e2e uses Jig's fake LLM to drive scripted architect and
# engineer replies without real provider credentials.
jig-core = { git = "http://127.0.0.1:3000/ai/jig.git", rev = "2b069df2e69ff137528813472ea56f07ede7a1fe" }
jig-server = { git = "http://127.0.0.1:3000/ai/jig.git", rev = "2b069df2e69ff137528813472ea56f07ede7a1fe" }
# Root transport/config tests use in-memory Forge state and worker protocol DTOs
# to assert daemon/worker behavior without a live Forge.
temper-forge-memory = { path = "crates/temper-forge-memory" }
temper-protocol-worker = { path = "crates/temper-protocol-worker" }
# `temper init` e2e (`tests/init_forgejo_e2e.rs`): drives the `run_init` library
# entry point with the real `ForgejoProvisioner` against the bench Forgejo
# fixture, then asserts the produced config/credentials resolve + lint clean and
# the forge state matches.
temper-cli-init = { path = "crates/temper-cli-init" }
temper-cli-common = { path = "crates/temper-cli-common" }
temper-provision = { path = "crates/temper-provision" }
temper-reference-delivery = { path = "crates/temper-reference-delivery" }
toml = { workspace = true }
tempfile = { workspace = true }
fs2 = { workspace = true }

# The unified everything-binary: `temper config|daemon|agent` (+ hidden operator
# tools). A one-line shim over `temper_cli::run()`.
[[bin]]
name = "temper"
path = "src/bin/temper.rs"

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# skein (the vendored async runtime) uses edition-2024 and let-chains; nothing
# in temper itself needs more than 1.88.
rust-version = "1.88"

[workspace.dependencies]
# skein: our maintained, MIT, cancel-correct async runtime (a clean-room fork of
# asupersync 0.2.4 — the last plain-MIT upstream release; 0.2.5+ carry an
# OpenAI/Anthropic license rider and 0.3.3+ require nightly). Lives in its own
# repo and is consumed from the local Forgejo `ai/skein` git remote.
#
# TLS features are enabled because the merged agent crates (formerly anvil)
# reach LLM providers over HTTPS. skein is needed by every role and so cannot be
# an optional/feature-gated dependency; cargo unifies features across the graph,
# so worker/daemon-only builds also link skein's TLS code. This is an accepted
# tradeoff — TLS is small relative to the agent's LLM/HTTP stack, which slim
# builds still exclude (it enters only via the `agent` feature crates).
# `tls-webpki-roots` is enabled here even though no temper crate needs the
# webpki root bundle directly: a dev-dependency (jig-record, via
# temper-agent) enables it, so test-scoped builds resolve skein with it
# while non-test builds resolve it without. That feature split forced skein —
# and its entire ~20-crate reverse-dependency tree — to recompile under two
# different keys every CI run, defeating the build cache. Enabling it
# unconditionally costs only a small static root bundle and keeps skein's
# resolved feature set identical across every build, so the cache is shared.
skein = { git = "http://127.0.0.1:3000/ai/skein.git", rev = "5cd8c4d88a41720afa8f509279bde53b16bf38d0", features = [
    "tls",
    "tls-native-roots",
    "tls-webpki-roots",
] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4"
# Type-level secrets for config: SecretString redacts in Debug, has no Display,
# is not Serialize (so a token cannot leak via a struct dump or accidental
# serialization), and zeroizes on drop. The `serde` feature is deliberately NOT
# enabled — Resolved must not be serializable.
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
# Merged-in agent stack (formerly anvil) and worker (formerly smith).
tongs = { git = "http://127.0.0.1:3000/ai/tongs.git", rev = "3ac95df9bd77d8420873b8f46203489bb847c3de" }
# Structured logging stack (see crates/temper-log). `tracing` is the facade;
# `tracing-subscriber` provides the registry + EnvFilter (RUST_LOG) + fmt layer
# + the `json` fmt layer behind the `TEMPER_LOG_FORMAT=json` toggle;
# `tracing-journald` is the systemd journal sink (Linux-only — gated per-target
# in temper-log's Cargo.toml).
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-journald = "0.3"
# OpenTelemetry seam (see crates/temper-log §6 "OTel posture"). These are wired
# into temper-log as OPTIONAL deps behind its disabled-by-default `otel` feature:
# the semantic model (dotted attributes, spans, the `event` enum) is adopted now,
# but no exporter/collector is wired — flipping the feature on adds one OTel layer
# next to journald with zero emit-site changes. Versions move in lockstep:
# tracing-opentelemetry 0.33 tracks the opentelemetry 0.32 line.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
tracing-opentelemetry = "0.33"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
