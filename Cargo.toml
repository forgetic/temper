# Profiles and lints follow skein's docs/foundation/programming-model.md, section 10.

[workspace]
resolver = "3"
members = [
    "crates/temper-web-domain",
    "crates/temper-engine-domain",
    "crates/temper-engine-smith",
    "jig/crates/jig-core-accounts",
    "jig/testing/jig-test-connector",
    "crates/temper-engine-domain-authority",
    "crates/temper-engine-domain-brief",
    "crates/temper-engine-domain-fleet",
    "crates/temper-engine-domain-forge-client",
    "crates/temper-engine-domain-forge-change",
    "crates/temper-engine-domain-forge-issues",
    "crates/temper-engine-domain-forge",
    "crates/temper-engine-domain-notes",
    "crates/temper-engine-domain-people",
    "crates/temper-engine-domain-tasks",
    "jig/crates/jig-core-views",
    "crates/temper-worker-domain",
    "crates/temper-worker-domain-agent",
    "crates/temper-worker-domain-checkout",
    "crates/temper-worker-domain-host",
    "crates/temper-web-view",
    "testing/temper-fake-forge-domain",
    "testing/temper-fake-person",
    "tests/fake-checkout",
    "jig/tests/accounts",
    "tests/engine/brief",
    "tests/engine/domain",
    "tests/system",
    "tests/engine/fleet",
    "tests/engine/forge/client",
    "tests/engine/forge",
    "tests/engine/notes",
    "tests/engine/people",
    "tests/engine/tasks",
    "jig/tests/views",
    "tests/fake-forge",
    "tests/worker/agent",
    "tests/worker/checkout",
    "tests/worker/host",
    "tests/worker/domain",
    "tests/web/domain",
    "tests/world",
    "jig/tests/boundary",
