[workspace]
members = [
    "crates/temper-workflow",
    "crates/temper-forge",
    "crates/temper-interaction",
    "crates/temper-forge-filesystem",
    "crates/temper-forge-memory",
    "crates/temper-forge-forgejo",
    "crates/temper-forgejo-fixture",
    "crates/temper-runner",
    "crates/temper-testing",
    "crates/temper-production",
]
resolver = "2"

[package]
name = "temper"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
testing-worker = ["dep:temper-testing"]

[dependencies]
temper-production = { path = "crates/temper-production" }
temper-testing = { path = "crates/temper-testing", optional = true }

[[bin]]
name = "temper-worker"
path = "src/bin/temper-worker.rs"

[[bin]]
name = "temper-provision-forgejo"
path = "src/bin/temper-provision-forgejo.rs"

[[bin]]
name = "temper-trigger-forgejo"
path = "src/bin/temper-trigger-forgejo.rs"

[[bin]]
name = "temper-validate-reference-delivery"
path = "src/bin/temper-validate-reference-delivery.rs"

[[bin]]
name = "temper-interaction"
path = "src/bin/temper-interaction.rs"

[[bin]]
name = "temper-testing-worker"
path = "src/bin/temper-testing-worker.rs"
required-features = ["testing-worker"]

[lints]
workspace = true

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.76"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

# Fast local iteration is the default. Production/release profiles can be tuned
# later when we have deployable artifacts. Cargo uses all available logical CPU
# cores by default; keep `.cargo/config.toml` free of a fixed `build.jobs` value.
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
lto = false

[profile.dev.package."*"]
debug = 0

[profile.test]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
lto = false
