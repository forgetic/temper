[package]
name = "temper-engine-domain-world"
description = "The new root with an atomic ordered fake store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
temper-world.workspace = true
temper-engine-domain.workspace = true
temper-engine-domain-people.workspace = true
temper-engine-domain-tasks.workspace = true
jig-core-fleet.workspace = true
temper-engine-domain-brief.workspace = true
jig-core-accounts.workspace = true
temper-engine-domain-authority.workspace = true
jig-core-views.workspace = true
temper-engine-domain-forge.workspace = true
temper-engine-domain-forge-change.workspace = true
temper-engine-domain-forge-client.workspace = true
temper-engine-forge-world = { path = "../forge" }
temper-fake-forge-domain.workspace = true
smith-domain.workspace = true
smith-domain-run.workspace = true
smith-domain-session.workspace = true
smith-domain-tools.workspace = true

[dev-dependencies]
temper-engine-tasks-world = { path = "../tasks" }
temper-engine-people-world = { path = "../people" }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
