[package]
name = "temper-engine-forge-world"
description = "Forge connector top against a scripted root and independent fake forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
temper-engine-domain-forge.workspace = true
temper-engine-domain-forge-client.workspace = true
temper-engine-domain-forge-issues = { path = "../../../crates/temper-engine-domain-forge-issues" }
temper-engine-domain-forge-change = { path = "../../../crates/temper-engine-domain-forge-change" }
temper-fake-forge-domain.workspace = true

[dev-dependencies]
temper-world.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
