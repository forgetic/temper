[package]
name = "temper-worker-model-tests"
description = "The whole worker's world: a simulation against a fake engine, a lossy network, scripted agents and a fake forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
temper-lib.workspace = true
temper-worker-model.workspace = true
temper-fake-engine-model.workspace = true
temper-checkout-fake.workspace = true
temper-worker-model-agent-tests.workspace = true
temper-worker-model-checkout-tests.workspace = true
temper-world.workspace = true

# Ordinary Rust (programming-style.md, 10.2), so not the step crates' lints.
# tests/integration/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the world asserts its invariants by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the translation
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
