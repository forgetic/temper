[package]
name = "temper-world"
description = "What the domain worlds share: a delivery schedule, stages driven under flow control, ledgers, traces, a counting allocator and the referee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
temper-lib.workspace = true

# Ordinary Rust (programming-model.md, 10.2), so not the step crates' lints.
# tests/integration/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "deny"                  # not forbid: heap's counting allocator expects it
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the harness asserts the contracts it keeps by panicking
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
