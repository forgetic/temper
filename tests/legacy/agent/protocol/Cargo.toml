[package]
name = "temper-legacy-agent-protocol-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-sim.workspace = true
skein-http.workspace = true
temper-legacy-agent-domain.workspace = true
temper-legacy-agent-protocol.workspace = true
temper-channel.workspace = true
temper-legacy-fake-llm-domain.workspace = true
temper-legacy-fake-llm-protocol.workspace = true
temper-oauth.workspace = true
temper-legacy-llm-anthropic.workspace = true
temper-legacy-llm-openai.workspace = true
temper-world.workspace = true

[lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
