[package]
name = "temper-agent-domain-world"
description = "The agent's top-level world: the real engine and worker hosting real agents, with a fake LLM provider, a fake forge and scripted people"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
temper-legacy-agent-domain.workspace = true
temper-legacy-agent-protocol.workspace = true
temper-channel.workspace = true
temper-legacy-llm-openai.workspace = true
temper-legacy-agent-tools-world.workspace = true
temper-fake-checkout.workspace = true
temper-legacy-engine-domain.workspace = true
temper-engine-protocol.workspace = true
temper-legacy-engine-forge-world.workspace = true
temper-legacy-engine-domain-world.workspace = true
temper-fake-forge-domain.workspace = true
temper-legacy-fake-llm-domain.workspace = true
temper-world.workspace = true
temper-worker-domain.workspace = true
temper-worker-domain-agent.workspace = true
temper-worker-checkout-world.workspace = true

# Ordinary Rust (programming-model.md, 10.2), so not the step crates' lints.
# tests/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the world asserts its invariants by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the translation
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
